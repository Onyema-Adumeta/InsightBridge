name: Deploy Frontend to Azure (CLI Method)

on:
  push:
    branches: [ main ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Build application
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: https://insightbridge-frontend-test.azurewebsites.net
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          npm ci
          npm run build
          rm -rf node_modules
          npm ci --omit=dev --ignore-scripts
          rm -rf .next/cache
      
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Deploy to Azure App Service
        run: |
          cd frontend
          az webapp deploy \
            --resource-group <YOUR_RESOURCE_GROUP> \
            --name insightbridge-frontend-test \
            --src-path . \
            --type zip \
            --async true
          
          echo "✅ Deployment initiated"
