name: Deploy Frontend (Next.js)
on:
  push:
    branches: [ main ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Build Next.js application
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: https://insightbridge-backend-test.azurewebsites.net
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NODE_ENV: production
        run: npm run build
      
      - name: Verify build
        working-directory: frontend
        run: |
          echo "✅ Build complete. Checking .next folder..."
          ls -la .next/server/ | head -15
          echo ""
          echo "Checking for critical files..."
          test -f .next/BUILD_ID && echo "✅ BUILD_ID exists"
          test -d .next/server/app && echo "✅ server/app exists"
          
          if [ -f .next/server/font-manifest.json ]; then
            echo "✅ font-manifest.json exists"
          else
            echo "⚠️  font-manifest.json not found - this may cause runtime errors"
            echo "Creating empty font-manifest.json as workaround..."
            echo '{"pages":{"/":[],"/_app":[]},"app":{},"appUsingSizeAdjust":false,"pagesUsingSizeAdjust":false}' > .next/server/font-manifest.json
            echo "✅ Created placeholder font-manifest.json"
          fi
      
      - name: Create .deployment file
        working-directory: frontend
        run: |
          cat > .deployment << 'EOF'
          [config]
          SCM_DO_BUILD_DURING_DEPLOYMENT = false
          EOF
      
      - name: Clean old .next folder on Azure
        run: |
          echo "🧹 Cleaning old .next folder..."
          curl -X DELETE \
            -u '$insightbridge-frontend-test:Lg1J1bwzwlpwo0F3bDMxghwSiQLDalTkezowfJ8vf5ReSSwoeqelnwEMKxYX' \
            https://insightbridge-frontend-test.scm.azurewebsites.net/api/vfs/site/wwwroot/.next/?recursive=true
          echo "✅ Cleaned"
      
      - name: Create deployment package
        working-directory: frontend
        run: |
          rm -f ../frontend.zip
          zip -r ../frontend.zip . \
            -x "node_modules/*" ".git/*" ".github/*"
          cd ..
          echo "✅ Package size: $(du -h frontend.zip | cut -f1)"
      
      - name: Deploy to Azure
        run: |
          echo "🚀 Deploying to Azure..."
          curl -X POST \
            -u '$insightbridge-frontend-test:Lg1J1bwzwlpwo0F3bDMxghwSiQLDalTkezowfJ8vf5ReSSwoeqelnwEMKxYX' \
            --data-binary @frontend.zip \
            -H "Content-Type: application/octet-stream" \
            https://insightbridge-frontend-test.scm.azurewebsites.net/api/zipdeploy
          echo ""
          echo "✅ Deployment completed!"
