name: Deploy Frontend (Next.js - Optimized)

on:
  push:
    branches: [ main ]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://insightbridge-backend.azurewebsites.net
          NODE_ENV: production
      
      - name: Create standalone deployment package
        run: |
          # Create deployment directory
          mkdir -p deploy
          
          # Copy standalone build (if using output: 'standalone' in next.config.js)
          if [ -d ".next/standalone" ]; then
            cp -r .next/standalone/* deploy/
            cp -r .next/static deploy/.next/static
            cp -r public deploy/public
          else
            # Standard build
            cp -r .next deploy/.next
            cp -r public deploy/public
            cp package.json deploy/
            cp package-lock.json deploy/
            if [ -f "next.config.js" ]; then cp next.config.js deploy/; fi
            if [ -f "next.config.mjs" ]; then cp next.config.mjs deploy/; fi
          fi
          
          # Create startup script
          cat > deploy/startup.sh <<'EOF'
          #!/bin/bash
          echo "Starting Next.js application..."
          
          # Install production dependencies if node_modules doesn't exist
          if [ ! -d "node_modules" ]; then
            npm ci --production
          fi
          
          # Start the application
          npm start
          EOF
          
          chmod +x deploy/startup.sh
          
          # Zip the deployment
          cd deploy
          zip -r ../frontend.zip . -x ".git/*"
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/frontend.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FRONTEND }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FRONTEND }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FRONTEND }}
      
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "insightbridge-frontend"
          slot-name: "Production"
          package: frontend.zip
      
      - name: Set App Service configuration
        run: |
          az webapp config set \
            --resource-group <YOUR_RESOURCE_GROUP> \
            --name insightbridge-frontend \
            --startup-file "startup.sh"
          
          az webapp config appsettings set \
            --resource-group <YOUR_RESOURCE_GROUP> \
            --name insightbridge-frontend \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              WEBSITE_NODE_DEFAULT_VERSION=20-lts \
              NODE_ENV=production \
              NEXT_PUBLIC_API_BASE_URL=https://insightbridge-backend.azurewebsites.net
      
      - name: Azure logout
        run: az logout
