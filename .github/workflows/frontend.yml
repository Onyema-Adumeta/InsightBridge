name: Deploy Frontend to Azure

on:
  push:
    branches: [ main ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend Application
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://insightbridge-backend-test.azurewebsites.net
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          echo "📦 Installing dependencies..."
          npm ci

          echo ""
          echo "🔨 Building Next.js application..."
          npm run build

          echo ""
          echo "✅ Build complete!"
          [ -d ".next" ] || { echo "❌ .next not created"; exit 1; }
          [ -f ".next/BUILD_ID" ] || { echo "❌ .next/BUILD_ID"; exit 1; }
          
          echo ""
          echo "🧹 Cleaning for production..."
          rm -rf node_modules
          rm -rf .next/cache

          echo "📦 Installing production dependencies..."
          npm ci --omit=dev --no-audit --no-fund
          echo "✅ Production dependencies installed"

      - name: Verify Build Artifacts
        working-directory: frontend
        run: |
          echo "🔍 Verifying all required files..."
          test -d .next || { echo "❌ Missing .next"; exit 1; }
          test -d .next/server || { echo "❌ Missing .next/server"; exit 1; }
          test -d .next/static || { echo "❌ Missing .next/static"; exit 1; }
          test -d node_modules/next || { echo "❌ Missing node_modules/next"; exit 1; }
          test -f node_modules/next/dist/bin/next || { echo "❌ Missing next binary"; exit 1; }
          echo "✅ All critical files present!"
          echo ""
          echo "📊 Build size:"
          du -sh .next node_modules

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    environment:
      name: 'Production'
      url: 'https://insightbridge-frontend-test.azurewebsites.net'

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./frontend

      - name: Verify downloaded artifacts
        run: |
          echo "📦 Verifying deployment package..."
          ls -la frontend/
          test -d frontend/.next || { echo "❌ .next missing after download"; exit 1; }
          test -d frontend/node_modules || { echo "❌ node_modules missing"; exit 1; }
          echo "✅ Package verified"

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'insightbridge-frontend-test'
          slot-name: 'Production'
          package: ./frontend
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_FRONTEND }}

      - name: Wait for application startup
        run: |
          echo ""
          echo "⏳ Waiting for Azure to start the application..."
          sleep 45

      - name: Verify Deployment
        timeout-minutes: 8
        run: |
          echo "🔍 Verifying deployment..."
          max_attempts=15
          
          for i in $(seq 1 $max_attempts); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 --connect-timeout 5 \
              https://insightbridge-frontend-test.azurewebsites.net/ 2>/dev/null || echo "000")
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo ""
              echo "✅ Frontend is live and responding!"
              echo ""
              echo "🌐 Application URL:"
              echo "   https://insightbridge-frontend-test.azurewebsites.net"
              exit 0
            elif [ "$HTTP_CODE" = "503" ]; then
              echo "Attempt $i/$max_attempts: Starting (503)... waiting 10s"
            else
              echo "Attempt $i/$max_attempts: Status $HTTP_CODE... waiting 10s"
            fi
            sleep 10
          done
          
          echo ""
          echo "⚠️ Application not responding after $max_attempts attempts"
          echo "💡 Check Azure logs if issue persists"

      - name: Deployment Summary
        if: always()
        run: |
          echo ""
          echo "================================"
          echo "🎉 Deployment Summary"
          echo "================================"
          echo "Frontend: https://insightbridge-frontend-test.azurewebsites.net"
          echo "Backend: https://insightbridge-backend-test.azurewebsites.net"
          echo "Backend Docs: https://insightbridge-backend-test.azurewebsites.net/docs"
          echo ""
          echo "🔧 Logs & Tools:"
          echo "   Frontend Logs: https://insightbridge-frontend-test.scm.azurewebsites.net/api/logstream"
          echo "   Kudu Console: https://insightbridge-frontend-test.scm.azurewebsites.net"
          echo ""
          echo "Time: $(date -u)"
          echo "================================"
