name: Deploy Frontend (Next.js) — Server Build

on:
  push:
    branches: [ main ]
    paths:
      - "InsightbridgeParent/frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Optional: quick typecheck/lint/build to fail fast before deploy
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: InsightbridgeParent/frontend/package-lock.json

      - name: CI build (optional but recommended)
        working-directory: InsightbridgeParent/frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: https://insightbridge-backend-test.azurewebsites.net
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NODE_ENV: production
        run: |
          npm ci
          npm run build

      # Deploy SOURCE (no node_modules / no .next)
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: insightbridge-frontend-test
          package: InsightbridgeParent/frontend
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_FRONTEND }}
