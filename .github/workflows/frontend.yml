name: Deploy Frontend to Azure

on:
  push:
    branches: [ main ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Build application
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: https://insightbridge-backend-test.azurewebsites.net
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          npm ci
          npm run build
          rm -rf node_modules
          npm ci --omit=dev
          
      - name: Create deployment package
        run: |
          cd frontend
          zip -r ../app.zip .next node_modules public package.json next.config.js 2>/dev/null || true
          cd ..
          ls -lh app.zip
      
      - name: Deploy to Azure via Kudu
        env:
          KUDU_USERNAME: $insightbridge-frontend-test
          KUDU_PASSWORD: Lg1J1bwzwlpwo0F3bDMxghwSiQLDalTkezowfJ8vf5ReSSwoeqelnwEMKxYX
        run: |
          echo "Deploying to Azure..."
          
          response=$(curl -X POST \
            "https://insightbridge-frontend-test.scm.azurewebsites.net/api/zipdeploy" \
            -u "${KUDU_USERNAME}:${KUDU_PASSWORD}" \
            --data-binary @app.zip \
            -H "Content-Type: application/octet-stream" \
            -w "\n%{http_code}" \
            -s)
          
          http_code=$(echo "$response" | tail -n1)
          
          if [ "$http_code" = "200" ] || [ "$http_code" = "202" ]; then
            echo "✅ Deployment successful!"
            exit 0
          else
            echo "❌ Deployment failed with code: $http_code"
            echo "$response"
            exit 1
          fi
