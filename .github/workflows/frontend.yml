name: Deploy Frontend (Next.js)

on:
  push:
    branches: [ main ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install + CI sanity build (optional)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: https://insightbridge-backend-test.azurewebsites.net
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NODE_ENV: production
        run: |
          npm ci
          npm run build

      - name: Create deployment package (source-only)
        run: |
          cd frontend
          rm -f ../frontend.zip
          zip -r ../frontend.zip . \
            -x ".git/*" ".github/*" "node_modules/*" ".next/*"
          cd ..
          echo "✅ Package size: $(du -h frontend.zip | cut -f1)"

      - name: Deploy via Kudu ZipDeploy API
        run: |
          echo "🚀 Deploying frontend..."
          curl -X POST \
            -u '$insightbridge-frontend-test:Lg1J1bwzwlpwo0F3bDMxghwSiQLDalTkezowfJ8vf5ReSSwoeqelnwEMKxYX' \
            --data-binary @frontend.zip \
            -H "Content-Type: application/octet-stream" \
            -s \
            https://insightbridge-frontend-test.scm.azurewebsites.net/api/zipdeploy?isAsync=true
          echo "✅ Deployment initiated."
