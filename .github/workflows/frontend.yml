name: Deploy Frontend to Azure
on:
  push:
    branches: [ main ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: 'Production'
      url: 'https://insightbridge-frontend-test.azurewebsites.net'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      # ✅ Cache Next.js build to speed up builds and reduce memory usage
      - name: Cache Next.js Build
        uses: actions/cache@v3
        with:
          path: |
            frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/**/*.js', 'frontend/**/*.jsx', 'frontend/**/*.ts', 'frontend/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-
            ${{ runner.os }}-nextjs-
      
      - name: Remove BOM from package.json
        working-directory: frontend
        run: |
          echo "🧹 Cleaning package.json..."
          sed -i '1s/^\xEF\xBB\xBF//' package.json || true
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))" && echo "✅ Valid JSON" || echo "❌ Invalid JSON"
      
      - name: Install Dependencies
        working-directory: frontend
        run: |
          echo "📦 Installing dependencies..."
          npm ci --prefer-offline --no-audit --no-fund
          echo "✅ Dependencies installed"
      
      - name: Build Frontend Application
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://insightbridge-backend-test.azurewebsites.net
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          # ✅ Optimized memory settings
          NODE_OPTIONS: "--max-old-space-size=4096 --max-semi-space-size=128"
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_ENV: "production"
        run: |
          echo "🔨 Building Next.js application..."
          echo "Memory limit: 4GB"
          echo "Build mode: Production"
          echo ""
          
          # Clear any stale build artifacts (but keep cache)
          rm -rf .next/server .next/static
          
          # Run the build
          npm run build
          
          echo ""
          echo "✅ Build complete!"
          
          # Verify build output
          if [ ! -d ".next" ]; then
            echo "❌ Error: .next directory not created"
            exit 1
          fi
          
          echo "📊 Build size:"
          du -sh .next
      
      - name: Prepare for Deployment
        working-directory: frontend
        run: |
          echo "🧹 Preparing deployment package..."
          
          # Remove development dependencies and cache to reduce package size
          rm -rf node_modules
          rm -rf .next/cache
          
          # Install only production dependencies
          echo "📦 Installing production dependencies..."
          npm ci --omit=dev --no-audit --no-fund --prefer-offline
          
          echo "✅ Production package ready"
          echo "📊 Package size:"
          du -sh .
      
      - name: Verify Build Artifacts
        working-directory: frontend
        run: |
          echo "🔍 Verifying build artifacts..."
          
          # Check for required directories
          test -d .next || { echo "❌ Missing .next directory"; exit 1; }
          test -d .next/server || { echo "❌ Missing .next/server directory"; exit 1; }
          test -d .next/static || { echo "❌ Missing .next/static directory"; exit 1; }
          
          # Check for Next.js binary
          test -d node_modules/next || { echo "❌ Missing next module"; exit 1; }
          test -f node_modules/next/dist/bin/next || { echo "❌ Missing next binary"; exit 1; }
          
          echo "✅ All required files present!"
          echo ""
          echo "📋 Build contents:"
          ls -lh .next/ | head -20
      
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'insightbridge-frontend-test'
          slot-name: 'production'
          package: ./frontend
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND }}
      
      - name: Wait for Azure Startup
        run: |
          echo "⏳ Waiting for Azure to initialize..."
          sleep 45
      
      - name: Verify Deployment
        timeout-minutes: 8
        run: |
          echo "🔍 Verifying application health..."
          echo ""
          
          max_attempts=15
          attempt=0
          
          for i in $(seq 1 $max_attempts); do
            attempt=$i
            
            # Try to fetch the homepage
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 \
              --retry 2 \
              --retry-delay 3 \
              https://insightbridge-frontend-test.azurewebsites.net/ 2>/dev/null || echo "000")
            
            echo "Attempt $i/$max_attempts: HTTP Status $HTTP_CODE"
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo ""
              echo "✅ Application is live and responding!"
              echo "🌐 URL: https://insightbridge-frontend-test.azurewebsites.net"
              exit 0
            elif [ "$HTTP_CODE" = "503" ]; then
              echo "   ⏳ Service starting up..."
            elif [ "$HTTP_CODE" = "000" ]; then
              echo "   ⏳ Service not reachable yet..."
            else
              echo "   ⚠️  Unexpected status code"
            fi
            
            # Don't sleep on the last attempt
            if [ $i -lt $max_attempts ]; then
              sleep 10
            fi
          done
          
          echo ""
          echo "⚠️  Warning: Application did not respond with 200 OK within timeout"
          echo "   Deployment completed but application may need more time to start"
          echo "   Check logs at: https://insightbridge-frontend-test.scm.azurewebsites.net/api/logstream"
          exit 0
      
      - name: Deployment Summary
        if: always()
        run: |
          echo ""
          echo "════════════════════════════════════════"
          echo "       Deployment Summary"
          echo "════════════════════════════════════════"
          echo ""
          echo "Frontend URL:"
          echo "  🌐 https://insightbridge-frontend-test.azurewebsites.net"
          echo ""
          echo "Backend URL:"
          echo "  🔗 https://insightbridge-backend-test.azurewebsites.net"
          echo ""
          echo "Logs & Diagnostics:"
          echo "  📋 https://insightbridge-frontend-test.scm.azurewebsites.net/api/logstream"
          echo "  🔍 https://portal.azure.com"
          echo ""
          echo "════════════════════════════════════════"
