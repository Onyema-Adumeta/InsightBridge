name: Deploy Frontend (Next.js)

on:
  push:
    branches: [ main ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"  # Changed to match actual filename
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies and build
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://insightbridge-backend-test.azurewebsites.net
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NODE_ENV: production
      
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'insightbridge-frontend-test'
          publish-profile: ${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE }}
          package: './frontend'
      
      - name: Wait and verify deployment
        run: |
          echo "⏳ Waiting for app to start..."
          sleep 60
          
          echo "🔍 Checking application..."
          for i in {1..10}; do
            response_code=$(curl -s -o /dev/null -w "%{http_code}" https://insightbridge-frontend-test.azurewebsites.net)
            
            if [ "$response_code" = "200" ]; then
              echo "✅ Frontend is live!"
              echo "Visit: https://insightbridge-frontend-test.azurewebsites.net"
              exit 0
            fi
            
            echo "Attempt $i/10: Status $response_code, waiting..."
            sleep 10
          done
          
          echo "⚠️  Check logs at: https://insightbridge-frontend-test.scm.azurewebsites.net"
