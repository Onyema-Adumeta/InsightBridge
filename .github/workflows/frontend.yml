name: Deploy Frontend (Next.js)

on:
  push:
    branches: [ main ]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Build Next.js app
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://insightbridge-backend-test.azurewebsites.net
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NODE_ENV: production
      
      - name: Create lightweight deployment package
        run: |
          cd frontend
          
          # Create package WITHOUT node_modules (much smaller)
          zip -r ../frontend.zip \
            .next \
            public \
            package.json \
            package-lock.json \
            next.config.js \
            -x ".git/*" \
            -x "*__pycache__*" \
            -x "*.cache/*"
          
          cd ..
          echo "✅ Package created ($(du -h frontend.zip | cut -f1))"
          ls -lh frontend.zip
      
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: '{"clientId":"${{ secrets.AZUREAPPSERVICE_CLIENTID_FRONTEND }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FRONTEND }}","tenantId":"${{ secrets.AZUREAPPSERVICE_TENANTID_FRONTEND }}"}'
      
      - name: Enable Oryx Build
        run: |
          az webapp config appsettings set \
            --name insightbridge-frontend-test \
            --resource-group InsightBridge-Test-RG \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true
      
      - name: Deploy using Azure CLI
        run: |
          az webapp deploy \
            --resource-group InsightBridge-Test-RG \
            --name insightbridge-frontend-test \
            --src-path frontend.zip \
            --type zip \
            --async false
      
      - name: Azure logout
        run: az logout
        if: always()
      
      - name: Verify deployment
        run: |
          echo "Waiting for app to start..."
          sleep 30
          
          status_code=$(curl -s -o /dev/null -w "%{http_code}" https://insightbridge-frontend-test.azurewebsites.net)
          
          echo "App status: $status_code"
          
          if [ "$status_code" = "200" ]; then
            echo "✅ App is running!"
          else
            echo "⚠️  App returned status: $status_code"
          fi
