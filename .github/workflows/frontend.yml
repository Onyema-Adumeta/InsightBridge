name: Deploy Frontend to Azure

on:
  push:
    branches: [ main ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend Application
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://insightbridge-backend-test.azurewebsites.net
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          echo "📦 Installing dependencies (including devDependencies for build)..."
          npm ci

          echo ""
          echo "🔨 Building Next.js application..."
          npm run build

          echo ""
          echo "✅ Build complete!"

          [ -d ".next" ] || { echo "❌ .next not created"; exit 1; }
          [ -f ".next/BUILD_ID" ] || { echo "❌ .next/BUILD_ID missing"; exit 1; }
          echo "✅ .next folder verified"
          
          echo ""
          echo "🧹 Cleaning for production deployment..."
          rm -rf node_modules
          rm -rf .next/cache

          echo "📦 Installing production dependencies only..."
          npm ci --omit=dev --no-audit --no-fund
          echo "✅ Production dependencies installed"

      - name: Verify Build Artifacts
        working-directory: frontend
        run: |
          echo "🔍 Verifying all required files exist..."
          test -d .next || { echo "❌ Missing .next folder"; exit 1; }
          test -f .next/BUILD_ID || { echo "❌ Missing .next/BUILD_ID"; exit 1; }
          test -d .next/server || { echo "❌ Missing .next/server folder"; exit 1; }
          test -d .next/static || { echo "❌ Missing .next/static folder"; exit 1; }
          test -d node_modules/next || { echo "❌ Missing node_modules/next"; exit 1; }
          test -f package.json || { echo "❌ Missing package.json"; exit 1; }
          echo "✅ All critical files present!"

      - name: Create Frontend Deployment Package
        working-directory: frontend
        run: |
          echo "📦 Creating frontend deployment ZIP package..."
          
          if [ ! -d "node_modules/next" ]; then
            echo "❌ ERROR: node_modules/next not found!"
            exit 1
          fi

          # Create ZIP with all necessary files
          zip -r ../deploy.zip .next node_modules package.json next.config.js 2>/dev/null || true
          [ -d public ] && zip -r ../deploy.zip public 2>/dev/null || true

          cd ..
          echo ""
          echo "✅ ZIP package created"
          echo "📏 Package size: $(du -h deploy.zip | cut -f1)"
          echo ""
          echo "🔍 Verifying .next folder is in deployment package..."
          if unzip -l deploy.zip | grep -q ".next/BUILD_ID"; then
            echo "✅ .next folder confirmed in ZIP"
          else
            echo "❌ ERROR: .next folder NOT in ZIP!"
            exit 1
          fi

      - name: Deploy to Azure
        timeout-minutes: 15
        run: |
          echo "🚀 Deploying frontend to Azure App Service..."
          echo "📍 Target: insightbridge-frontend-test"
          echo ""
          
          HTTP_CODE=$(curl -X POST \
            "https://insightbridge-frontend-test.scm.azurewebsites.net/api/zipdeploy" \
            -u '$insightbridge-frontend-test:${{ secrets.AZURE_PUBLISH_PROFILE_PASSWORD }}' \
            --data-binary @deploy.zip \
            -H "Content-Type: application/octet-stream" \
            --max-time 900 \
            --connect-timeout 120 \
            -w "%{http_code}" \
            -o /dev/null \
            -s)
          
          echo "HTTP Status: $HTTP_CODE"
          echo ""
          
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
            echo "✅ Deployment accepted by Azure!"
          elif [ "$HTTP_CODE" = "504" ]; then
            echo "⚠️ Gateway timeout (504). Deployment may still be processing."
            exit 0
          else
            echo "❌ Deployment failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Wait for Azure Processing
        run: |
          echo ""
          echo "⏳ Waiting for Azure to extract and start application..."
          sleep 60

      - name: Verify Deployment
        timeout-minutes: 10
        run: |
          echo ""
          echo "🔍 Verifying deployment..."
          max_attempts=15
          
          for i in $(seq 1 $max_attempts); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 --connect-timeout 5 \
              https://insightbridge-frontend-test.azurewebsites.net/ 2>/dev/null || echo "000")
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Frontend is responding!"
              echo ""
              echo "🌐 Application URL:"
              echo "   https://insightbridge-frontend-test.azurewebsites.net"
              echo ""
              echo "🔗 Backend API:"
              echo "   https://insightbridge-backend-test.azurewebsites.net"
              exit 0
            elif [ "$HTTP_CODE" = "503" ]; then
              echo "Attempt $i/$max_attempts: App starting (503) - waiting 10s..."
            else
              echo "Attempt $i/$max_attempts: Status $HTTP_CODE - waiting 10s..."
            fi
            sleep 10
          done
          
          echo ""
          echo "⚠️ Application not responding after $max_attempts attempts"
          echo "💡 Deployment was accepted - app may need more time"
          exit 0

      - name: Deployment Summary
        if: always()
        run: |
          echo ""
          echo "================================"
          echo "🎉 Frontend Deployment Summary"
          echo "================================"
          echo "Frontend App: insightbridge-frontend-test"
          echo "Backend API: insightbridge-backend-test"
          echo "Architecture: Separate microservices"
          echo ""
          echo "🔗 URLs:"
          echo "   Frontend: https://insightbridge-frontend-test.azurewebsites.net"
          echo "   Backend API: https://insightbridge-backend-test.azurewebsites.net"
          echo "   Backend Docs: https://insightbridge-backend-test.azurewebsites.net/docs"
          echo ""
          echo "🔧 Logs:"
          echo "   Frontend: https://insightbridge-frontend-test.scm.azurewebsites.net/api/logstream"
          echo "   Backend: https://insightbridge-backend-test.scm.azurewebsites.net/api/logstream"
          echo ""
          echo "Time: $(date)"
          echo "================================"
