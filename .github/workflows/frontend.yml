name: Deploy Frontend (Next.js)
on:
  push:
    branches: [ main ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Build Next.js application
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: https://insightbridge-backend-test.azurewebsites.net
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NODE_ENV: production
        run: npm run build
      
      - name: Verify build output
        working-directory: frontend
        run: |
          echo "Checking .next folder..."
          test -f .next/BUILD_ID || (echo "ERROR: BUILD_ID missing" && exit 1)
          echo "✅ Build verified"
      
      - name: Install production dependencies only
        working-directory: frontend
        run: |
          rm -rf node_modules
          npm ci --production --no-audit --no-fund
      
      - name: Create deployment package
        working-directory: frontend
        run: |
          rm -f ../deploy.zip
          zip -r ../deploy.zip \
            .next \
            node_modules \
            public \
            package.json \
            next.config.js \
            -x "*.log" ".git/*" ".github/*"
          cd ..
          echo "✅ Package size: $(du -h deploy.zip | cut -f1)"
      
      - name: Clean wwwroot directory
        run: |
          echo "🧹 Cleaning old files..."
          curl -X DELETE \
            "https://insightbridge-frontend-test.scm.azurewebsites.net/api/vfs/site/wwwroot/.next/?recursive=true" \
            -u '$insightbridge-frontend-test:Lg1J1bwzwlpwo0F3bDMxghwSiQLDalTkezowfJ8vf5ReSSwoeqelnwEMKxYX'
          
          curl -X DELETE \
            "https://insightbridge-frontend-test.scm.azurewebsites.net/api/vfs/site/wwwroot/node_modules/?recursive=true" \
            -u '$insightbridge-frontend-test:Lg1J1bwzwlpwo0F3bDMxghwSiQLDalTkezowfJ8vf5ReSSwoeqelnwEMKxYX'
          
          echo "✅ Cleaned"
      
      - name: Upload package to Azure
        run: |
          echo "🚀 Uploading package..."
          curl -X PUT \
            "https://insightbridge-frontend-test.scm.azurewebsites.net/api/vfs/site/wwwroot/deploy.zip" \
            -u '$insightbridge-frontend-test:Lg1J1bwzwlpwo0F3bDMxghwSiQLDalTkezowfJ8vf5ReSSwoeqelnwEMKxYX' \
            -T deploy.zip \
            -H "Content-Type: application/zip"
          echo "✅ Uploaded"
      
      - name: Extract package on Azure
        run: |
          echo "📦 Extracting..."
          # Use proper shell command format
          curl -X POST \
            "https://insightbridge-frontend-test.scm.azurewebsites.net/api/command" \
            -u '$insightbridge-frontend-test:Lg1J1bwzwlpwo0F3bDMxghwSiQLDalTkezowfJ8vf5ReSSwoeqelnwEMKxYX' \
            -H "Content-Type: application/json" \
            -d '{"command": "unzip -o deploy.zip && rm deploy.zip", "dir": "/home/site/wwwroot"}'
          
          echo "✅ Extracted"
      
      - name: Restart App Service
        run: |
          echo "🔄 Restarting..."
          curl -X POST \
            "https://insightbridge-frontend-test.scm.azurewebsites.net/api/app/restart" \
            -u '$insightbridge-frontend-test:Lg1J1bwzwlpwo0F3bDMxghwSiQLDalTkezowfJ8vf5ReSSwoeqelnwEMKxYX'
          echo "✅ Done!"
