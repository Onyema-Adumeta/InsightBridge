name: Deploy Frontend to Azure

on:
  push:
    branches: [ main ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Build application
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: https://insightbridge-frontend-test.azurewebsites.net
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          npm ci
          npm run build
          
          # Aggressive cleanup for smaller package
          rm -rf node_modules
          rm -rf .next/cache
          npm ci --omit=dev --no-audit --no-fund
          
          # Remove unnecessary files from node_modules
          find node_modules -name "*.md" -delete
          find node_modules -name "*.ts" -not -path "*/node_modules/@types/*" -delete
          find node_modules -name "test" -type d -exec rm -rf {} + 2>/dev/null || true
          find node_modules -name "tests" -type d -exec rm -rf {} + 2>/dev/null || true
          find node_modules -name "*.map" -delete
          
          echo "Final sizes:"
          du -sh .next node_modules
      
      - name: Create deployment package
        working-directory: frontend
        run: |
          zip -9 -r ../app.zip .next node_modules public package.json next.config.js 2>/dev/null || true
          cd ..
          echo "Final package: $(du -h app.zip | cut -f1)"
      
      - name: Deploy to Azure
        run: |
          curl -X POST \
            "https://insightbridge-frontend-test.scm.azurewebsites.net/api/zipdeploy" \
            -u '$insightbridge-frontend-test:Lg1J1bwzwlpwo0F3bDMxghwSiQLDalTkezowfJ8vf5ReSSwoeqelnwEMKxYX' \
            --data-binary @app.zip \
            -H "Content-Type: application/octet-stream" \
            --max-time 900 \
            -w "\nHTTP: %{http_code}\n" \
            --fail-with-body || echo "Deployment may have timed out but could still succeed"
          
          echo "Waiting for deployment to settle..."
          sleep 30
          
          echo "✅ Deployment complete. Check: https://insightbridge-frontend-test.azurewebsites.net"
