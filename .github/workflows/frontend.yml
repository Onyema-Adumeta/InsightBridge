name: Deploy Frontend to Azure
on:
  push:
    branches: [ main ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: 'Production'
      url: 'https://insightbridge-frontend-test.azurewebsites.net'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Build Frontend Application
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://insightbridge-backend-test.azurewebsites.net
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          echo "📦 Installing dependencies..."
          npm ci
          echo ""
          echo "🔨 Building Next.js application with increased memory..."
          export NODE_OPTIONS="--max-old-space-size=6144"
          npm run build
          echo ""
          echo "✅ Build complete!"
          [ -d ".next" ] || { echo "❌ .next not created"; exit 1; }
          
          echo ""
          echo "🧹 Preparing for deployment..."
          rm -rf node_modules
          rm -rf .next/cache
          echo "📦 Installing production dependencies..."
          npm ci --omit=dev --no-audit --no-fund
          echo "✅ Production ready"
      
      - name: Verify Build
        working-directory: frontend
        run: |
          echo "🔍 Verifying build artifacts..."
          test -d .next || { echo "❌ Missing .next"; exit 1; }
          test -d node_modules/next || { echo "❌ Missing next"; exit 1; }
          test -f node_modules/next/dist/bin/next || { echo "❌ Missing next binary"; exit 1; }
          echo "✅ All files present!"
      
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'insightbridge-frontend-test'
          slot-name: 'production'
          package: ./frontend
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND }}
      
      - name: Wait for startup
        run: |
          echo "⏳ Waiting for Azure to start..."
          sleep 45
      
      - name: Verify Deployment
        timeout-minutes: 8
        run: |
          echo "🔍 Checking application..."
          max_attempts=15
          
          for i in $(seq 1 $max_attempts); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 \
              https://insightbridge-frontend-test.azurewebsites.net/ 2>/dev/null || echo "000")
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo ""
              echo "✅ Application is live!"
              echo "🌐 https://insightbridge-frontend-test.azurewebsites.net"
              exit 0
            fi
            echo "Attempt $i/$max_attempts: Status $HTTP_CODE"
            sleep 10
          done
          
          echo "⚠️ Deployment complete but app needs more time to start"
      
      - name: Summary
        if: always()
        run: |
          echo ""
          echo "================================"
          echo "Deployment Complete"
          echo "================================"
          echo "Frontend: https://insightbridge-frontend-test.azurewebsites.net"
          echo "Backend: https://insightbridge-backend-test.azurewebsites.net"
          echo "Logs: https://insightbridge-frontend-test.scm.azurewebsites.net/api/logstream"
          echo "================================"
