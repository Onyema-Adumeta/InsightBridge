name: Deploy Frontend to Azure

on:
  push:
    branches: [ main ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Debug - Verify repository contents
        run: |
          echo "=== Current directory ==="
          pwd
          echo ""
          echo "=== Repository root contents ==="
          ls -la
          echo ""
          echo "=== Frontend directory exists? ==="
          ls -la frontend/ || echo "Frontend directory not found!"
          echo ""
          echo "=== Frontend src directory ==="
          ls -la frontend/src/ || echo "src not found!"
          echo ""
          echo "=== Components directory ==="
          ls -la frontend/src/components/ | head -20 || echo "Components not found!"
          echo ""
          echo "=== Context directory ==="
          ls -la frontend/src/context/ || echo "Context not found!"
          echo ""
          echo "=== Looking for specific files with find ==="
          find frontend/src -name "*AppSidebar*" 2>/dev/null || echo "Find failed"
          find frontend/src -name "*SimulationChart*" 2>/dev/null || echo "Find failed"
          find frontend/src -name "*AnalysisContext*" 2>/dev/null || echo "Find failed"
          echo ""
          echo "=== Current commit hash ==="
          git rev-parse HEAD
          echo ""
          echo "=== Files that SHOULD be in this commit ==="
          git ls-tree -r HEAD --name-only | grep -E "AppSidebar|SimulationChart|AnalysisContext" || true

      - name: Verify imports before build
        working-directory: frontend
        run: |
          echo "=== Verifying tsconfig.json paths ==="
          cat tsconfig.json | grep -A 3 '"paths"' || echo "No paths section found"
          echo ""
          echo "=== Verifying critical files exist ==="
          test -f src/components/AppSidebar.tsx && echo "âœ“ AppSidebar.tsx exists" || echo "âœ— AppSidebar.tsx MISSING"
          test -f src/components/SimulationChart.tsx && echo "âœ“ SimulationChart.tsx exists" || echo "âœ— SimulationChart.tsx MISSING"
          test -f src/context/AnalysisContext.tsx && echo "âœ“ AnalysisContext.tsx exists" || echo "âœ— AnalysisContext.tsx MISSING"
          echo ""
          echo "=== File sizes ==="
          ls -lh src/components/AppSidebar.tsx src/components/SimulationChart.tsx src/context/AnalysisContext.tsx 2>/dev/null || echo "Files not accessible"
          echo ""
          echo "=== Checking import statements ==="
          grep -n "import.*AppSidebar" src/app/\(app\)/layout.tsx || echo "No AppSidebar import"
          grep -n "import.*SimulationChart" src/app/\(app\)/strategic-advisor/page.tsx || echo "No SimulationChart import"
          grep -n "import.*AnalysisContext" src/app/\(app\)/strategic-advisor/page.tsx || echo "No AnalysisContext import"

      - name: Fail fast on case-sensitivity mistakes
        working-directory: frontend
        run: |
          echo "ðŸ”Ž Exact-case check for '@/components' and '@/context' imports"
          set -e
          IMPORTS=$(grep -Ehro --include=\*.{ts,tsx} "from ['\"]@\/(components|context)\/[A-Za-z0-9\/_.-]+['\"]" src || true)
          if [ -z "$IMPORTS" ]; then
            echo "No alias imports found."
            exit 0
          fi
          ERR=0
          while IFS= read -r line; do
            REL=$(echo "$line" | sed -E "s/.*from ['\"]@\/([^'\"]+)['\"].*/\1/")
            if [ -f "src/$REL" ] || [ -f "src/$REL.tsx" ] || [ -f "src/$REL.ts" ]; then
              echo "âœ“ @/$REL"
            else
              echo "âŒ Missing (case mismatch or wrong path): @/$REL"
              ERR=1
            fi
          done <<< "$IMPORTS"
          if [ $ERR -ne 0 ]; then
            echo "ðŸ”´ Fix the import casing to match filenames exactly."
            exit 1
          fi
          echo "âœ… All alias imports resolve with exact casing."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build application
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://insightbridge-backend-test.azurewebsites.net
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          echo "ðŸ“¦ Installing dependencies (including devDependencies for build)..."
          npm ci

          echo ""
          echo "ðŸ§© Ensuring TypeScript deps (CI safeguard)..."
          npm ls typescript >/dev/null 2>&1 || npm i -D --no-save typescript@5 @types/react@18 @types/react-dom@18 @types/node@20

          echo ""
          echo "ðŸ”¨ Building Next.js application..."
          npm run build

          echo ""
          echo "âœ… Build complete!"

          [ -d ".next" ] || { echo "âŒ .next not created"; exit 1; }
          [ -f ".next/BUILD_ID" ] || { echo "âŒ .next/BUILD_ID missing"; exit 1; }
          echo "âœ… .next folder verified"
          echo ""
          echo "ðŸ“Š Build sizes:"
          du -sh .next node_modules

          echo ""
          echo "ðŸ§¹ Cleaning for production deployment..."
          rm -rf node_modules
          rm -rf .next/cache

          echo "ðŸ“¦ Installing production dependencies only..."
          npm ci --omit=dev --no-audit --no-fund
          echo "âœ… Production dependencies installed"

      - name: Verify build artifacts
        working-directory: frontend
        run: |
          echo "ðŸ” Verifying all required files exist..."
          test -d .next || { echo "âŒ Missing .next folder"; exit 1; }
          test -f .next/BUILD_ID || { echo "âŒ Missing .next/BUILD_ID"; exit 1; }
          test -d .next/server || { echo "âŒ Missing .next/server folder"; exit 1; }
          test -d .next/static || { echo "âŒ Missing .next/static folder"; exit 1; }
          test -d node_modules/next || { echo "âŒ Missing node_modules/next"; exit 1; }
          test -f package.json || { echo "âŒ Missing package.json"; exit 1; }
          echo "âœ… All critical files present!"
          echo ""
          echo "ðŸ“ .next folder structure:"
          ls -la .next/ | head -15

      - name: Create deployment package
        working-directory: frontend
        run: |
          echo "ðŸ“¦ Creating deployment ZIP package..."
          if [ ! -d "node_modules/next" ]; then
            echo "âŒ ERROR: node_modules/next not found!"
            exit 1
          fi
          ls -la node_modules/next/dist/bin/ || echo "Warning: next bin not found"

          zip -r ../deploy.zip \
            .next \
            node_modules \
            package.json \
            next.config.js \
            next.config.mjs \
            public \
            2>/dev/null || zip -r ../deploy.zip .next node_modules package.json next.config.js public

          cd ..
          echo ""
          echo "âœ… ZIP package created"
          echo "ðŸ“ Package size: $(du -h deploy.zip | cut -f1)"
          echo ""
          echo "ðŸ” Verifying .next folder is in deployment package..."
          if unzip -l deploy.zip | grep -q ".next/BUILD_ID"; then
            echo "âœ… .next folder confirmed in ZIP"
          else
            echo "âŒ ERROR: .next folder NOT in ZIP!"
            unzip -l deploy.zip | head -30
            exit 1
          fi
          echo ""
          echo "ðŸ“‹ First 30 files in ZIP:"
          unzip -l deploy.zip | head -30

      - name: Deploy to Azure
        timeout-minutes: 15
        run: |
          echo "ðŸš€ Deploying to Azure App Service..."
          echo "ðŸ“ Target: insightbridge-frontend-test"
          echo ""
          HTTP_CODE=$(curl -X POST \
            "https://insightbridge-frontend-test.scm.azurewebsites.net/api/zipdeploy" \
            -u '$insightbridge-frontend-test:${{ secrets.AZURE_PUBLISH_PROFILE_PASSWORD }}' \
            --data-binary @deploy.zip \
            -H "Content-Type: application/octet-stream" \
            --max-time 900 \
            --connect-timeout 120 \
            -w "%{http_code}" \
            -o /dev/null \
            -s)
          echo "HTTP Status: $HTTP_CODE"
          echo ""
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
            echo "âœ… Deployment accepted by Azure!"
          elif [ "$HTTP_CODE" = "504" ]; then
            echo "âš ï¸ Gateway timeout (504). Deployment may still be processing."
            exit 0
          else
            echo "âŒ Deployment failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Wait for Azure processing
        run: |
          echo ""
          echo "â³ Waiting for Azure to extract and start application..."
          sleep 75

      - name: Verify deployment
        timeout-minutes: 5
        run: |
          echo ""
          echo "ðŸ” Verifying deployment..."
          max_attempts=15
          for i in $(seq 1 $max_attempts); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 --connect-timeout 5 \
              https://insightbridge-frontend-test.azurewebsites.net/ 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "âœ… Application is responding!"
              echo ""
              echo "ðŸŒ URLs:"
              echo "   App: https://insightbridge-frontend-test.azurewebsites.net"
              echo "   Dashboard: https://insightbridge-frontend-test.azurewebsites.net/dashboard"
              exit 0
            elif [ "$HTTP_CODE" = "503" ]; then
              echo "Attempt $i/$max_attempts: App starting (503) - waiting 10s..."
            else
              echo "Attempt $i/$max_attempts: Status $HTTP_CODE - waiting 10s..."
            fi
            sleep 10
          done
          echo ""
          echo "âš ï¸ Application not responding after $max_attempts attempts"
          echo "ðŸ’¡ Deployment was accepted - app may need more time"
          exit 0

      - name: Deployment summary
        if: always()
        run: |
          echo ""
          echo "================================"
          echo "ðŸŽ‰ Deployment Summary"
          echo "================================"
          echo "Application: insightbridge-frontend-test"
          echo "Region: Canada Central"
          echo ""
          echo "ðŸ”— Important URLs:"
          echo "   App: https://insightbridge-frontend-test.azurewebsites.net"
          echo "   Dashboard: https://insightbridge-frontend-test.azurewebsites.net/dashboard"
          echo "   Kudu: https://insightbridge-frontend-test.scm.azurewebsites.net"
          echo "   Logs: https://insightbridge-frontend-test.scm.azurewebsites.net/api/logstream"
          echo ""
          echo "ðŸ’¡ Post-deployment:"
          echo "   â€¢ Wait 2-3 minutes for full startup"
          echo "   â€¢ Hard refresh browser (Ctrl+Shift+R)"
          echo "   â€¢ Check Kudu to verify .next exists"
          echo ""
          echo "ðŸ”§ If issues persist:"
          echo "   â€¢ Startup Command: node_modules/next/dist/bin/next start"
          echo "   â€¢ Or: npm start"
          echo ""
          echo "Time: $(date)"
          echo "================================"


