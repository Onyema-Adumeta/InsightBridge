name: Deploy Frontend (Next.js)
on:
  push:
    branches: [ main ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Build Next.js application
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: https://insightbridge-backend-test.azurewebsites.net
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NODE_ENV: production
        run: npm run build
      
      - name: Verify .next folder exists
        working-directory: frontend
        run: |
          if [ ! -d ".next" ]; then
            echo "❌ ERROR: .next folder not found after build!"
            exit 1
          fi
          echo "✅ .next folder exists"
          ls -la .next/
          echo ""
          echo "Contents of .next/server:"
          ls -la .next/server/ | head -20
      
      - name: Create .deployment file to disable Oryx build
        working-directory: frontend
        run: |
          cat > .deployment << 'EOF'
          [config]
          SCM_DO_BUILD_DURING_DEPLOYMENT = false
          EOF
          echo "✅ Created .deployment file"
      
      - name: Create deployment package (include .next)
        run: |
          cd frontend
          rm -f ../frontend.zip
          # Explicitly include .next folder, exclude only node_modules and git
          zip -r ../frontend.zip \
            .next \
            public \
            src \
            package.json \
            package-lock.json \
            next.config.js \
            tsconfig.json \
            .deployment \
            -x "node_modules/*" ".git/*" ".github/*"
          cd ..
          echo "✅ Package created"
          echo "Package size: $(du -h frontend.zip | cut -f1)"
          echo ""
          echo "Verifying .next is in the zip:"
          unzip -l frontend.zip | grep -E "\.next/(server|static)" | head -10
      
      - name: Deploy to Azure
        run: |
          echo "🚀 Deploying pre-built Next.js app to Azure..."
          curl -X POST \
            -u '$insightbridge-frontend-test:Lg1J1bwzwlpwo0F3bDMxghwSiQLDalTkezowfJ8vf5ReSSwoeqelnwEMKxYX' \
            --data-binary @frontend.zip \
            -H "Content-Type: application/octet-stream" \
            https://insightbridge-frontend-test.scm.azurewebsites.net/api/zipdeploy
          echo ""
          echo "✅ Deployment completed!"
