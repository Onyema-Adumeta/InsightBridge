name: Deploy Frontend to Azure

on:
  push:
    branches: [ main ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Build application
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: https://insightbridge-backend-test.azurewebsites.net
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          npm ci
          npm run build
          
          # Clean production install
          rm -rf node_modules
          rm -rf .next/cache
          npm ci --omit=dev --no-audit --no-fund
          
          echo "Build complete. Package sizes:"
          du -sh .next node_modules
      
      - name: Create deployment package
        working-directory: frontend
        run: |
          zip -r ../app.zip .next node_modules public package.json next.config.js 2>/dev/null || true
          cd ..
          echo "Package size: $(du -h app.zip | cut -f1)"
      
      - name: Deploy to Azure
        run: |
          echo "Deploying to Azure..."
          
          HTTP_CODE=$(curl -X POST \
            "https://insightbridge-frontend-test.scm.azurewebsites.net/api/zipdeploy" \
            -u '$insightbridge-frontend-test:Lg1J1bwzwlpwo0F3bDMxghwSiQLDalTkezowfJ8vf5ReSSwoeqelnwEMKxYX' \
            --data-binary @app.zip \
            -H "Content-Type: application/octet-stream" \
            --max-time 900 \
            -w "%{http_code}" \
            -o /dev/null \
            -s)
          
          echo "HTTP Status: $HTTP_CODE"
          
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
            echo "✅ Deployment successful!"
          elif [ "$HTTP_CODE" = "504" ]; then
            echo "⚠️  Gateway timeout - deployment may still be processing"
            echo "Check Azure portal logs in 2-3 minutes"
          else
            echo "❌ Deployment failed with HTTP $HTTP_CODE"
            exit 1
          fi
