name: Deploy Frontend (Next.js)

on:
  push:
    branches: [ main ]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Build Next.js app
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://insightbridge-backend-test.azurewebsites.net
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NODE_ENV: production
      
      - name: Create deployment package
        run: |
          cd frontend
          
          # Create package with production dependencies only
          zip -r ../frontend.zip \
            .next \
            public \
            package.json \
            package-lock.json \
            next.config.js \
            -x ".git/*" \
            -x "*__pycache__*"
          
          cd ..
          echo "✅ Package size: $(du -h frontend.zip | cut -f1)"
      
      - name: Deploy via Kudu ZipDeploy API
        run: |
          echo "🚀 Deploying frontend via Kudu..."
          
          # Use async deployment to avoid timeout
          response=$(curl -X POST \
            -u '$insightbridge-frontend-test:Lg1J1bwzwlpwo0F3bDMxghwSiQLDalTkezowfJ8vf5ReSSwoeqelnwEMKxYX' \
            --data-binary @frontend.zip \
            -H "Content-Type: application/octet-stream" \
            -w "\n%{http_code}" \
            -s \
            https://insightbridge-frontend-test.scm.azurewebsites.net/api/zipdeploy?isAsync=true)
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)
          
          echo "Response: $body"
          echo "Status code: $http_code"
          
          if [ "$http_code" = "200" ] || [ "$http_code" = "202" ]; then
            echo "✅ Deployment initiated successfully!"
          else
            echo "❌ Deployment failed!"
            echo "Response body: $body"
            exit 1
          fi
      
      - name: Wait for deployment to complete
        run: |
          echo "Waiting for deployment to process..."
          sleep 60
          
          echo "Checking deployment status..."
          curl -u '$insightbridge-frontend-test:Lg1J1bwzwlpwo0F3bDMxghwSiQLDalTkezowfJ8vf5ReSSwoeqelnwEMKxYX' \
            https://insightbridge-frontend-test.scm.azurewebsites.net/api/deployments/latest
      
      - name: Configure app settings for Next.js
        run: |
          echo "Configuring app settings..."
          curl -X POST \
            -u '$insightbridge-frontend-test:Lg1J1bwzwlpwo0F3bDMxghwSiQLDalTkezowfJ8vf5ReSSwoeqelnwEMKxYX' \
            -H "Content-Type: application/json" \
            -d '{"SCM_DO_BUILD_DURING_DEPLOYMENT":"true","WEBSITE_NODE_DEFAULT_VERSION":"~20"}' \
            https://insightbridge-frontend-test.scm.azurewebsites.net/api/settings
      
      - name: Verify deployment
        run: |
          echo "Waiting for app to start..."
          sleep 30
          
          for i in {1..5}; do
            status_code=$(curl -s -o /dev/null -w "%{http_code}" https://insightbridge-frontend-test.azurewebsites.net)
            echo "Attempt $i: Status $status_code"
            
            if [ "$status_code" = "200" ]; then
              echo "✅ Frontend is live!"
              exit 0
            fi
            
            sleep 10
          done
          
          echo "⚠️ Frontend may need more time to start"
