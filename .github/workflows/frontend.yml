name: Deploy Frontend (Next.js)

on:
  push:
    branches: [ main ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Optional: quick visibility
      - name: Show repo layout
        run: |
          pwd
          ls -la
          ls -la frontend || true
          test -f frontend/package-lock.json && echo "Lockfile OK"

      - name: Use Node 20 + npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json

      - name: Install deps (frontend)
        working-directory: frontend
        run: npm ci

      - name: Build (frontend)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: https://insightbridge-backend-test.azurewebsites.net
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NODE_ENV: production
        run: npm run build

      # Deploy SOURCE folder (let server do npm ci + start)
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: insightbridge-frontend-test
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_FRONTEND }}
          package: frontend
