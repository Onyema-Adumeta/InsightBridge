name: Build and deploy Fullstack app to Azure Web App - insightbridge-test-app

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      #-------------------------------------
      # Frontend Build Steps
      #-------------------------------------
      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x' # Use your project's Node.js version

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install # Or yarn install / pnpm install

      - name: Build Frontend App
        working-directory: ./frontend
        run: |
          rm -rf .next
          npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_API_TIMEOUT: ${{ secrets.NEXT_PUBLIC_API_TIMEOUT }}

      #-------------------------------------
      # Backend Build Steps
      #-------------------------------------
      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create virtual environment and install backend dependencies
        working-directory: ./backend
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      #-------------------------------------
      # Package BOTH Frontend and Backend
      #-------------------------------------
      - name: Zip artifact for deployment
        run: |
          # Create a deployment package directory
          mkdir -p deploy_package/frontend
          mkdir -p deploy_package/backend
          
          # Copy backend files (excluding venv, pycache, etc.)
          echo "Copying backend files..."
          rsync -av --progress backend/ deploy_package/backend/ --exclude venv --exclude __pycache__ --exclude '*.pyc' --exclude '*.db'
          
          # Copy essential frontend files for running Next.js
          echo "Copying frontend files..."
          if [ -d "frontend/.next" ]; then
            rsync -av --progress frontend/.next/ deploy_package/frontend/.next/
          else
            echo "Warning: .next folder not found"
          fi
          
          if [ -d "frontend/public" ]; then
            rsync -av --progress frontend/public/ deploy_package/frontend/public/
          fi
          
          cp frontend/package.json deploy_package/frontend/package.json
          
          # Copy next.config.js or .mjs depending on your file name
          if [ -f "frontend/next.config.js" ]; then cp frontend/next.config.js deploy_package/frontend/; fi
          if [ -f "frontend/next.config.mjs" ]; then cp frontend/next.config.mjs deploy_package/frontend/; fi
          
          # Copy the startup script (assuming it's in the root)
          if [ -f "startup.sh" ]; then cp startup.sh deploy_package/; fi
          if [ -f "ecosystem.config.js" ]; then cp ecosystem.config.js deploy_package/; fi
          
          # Zip the combined package
          echo "Zipping deployment package..."
          cd deploy_package
          zip -r ../release.zip .
          cd ..

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: fullstack-app # Changed artifact name for clarity
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # Required for Azure login using OIDC
      contents: read

    environment: # Optional: Define environment for secrets/variables
      name: production # Or 'testing' etc.
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: fullstack-app # Use the new artifact name

      - name: Unzip artifact for deployment
        run: unzip release.zip -d deploy_temp && rm release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C671DC860D2D4CA98A09B82E3C289B76 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_73C0753D16CA485BA2B18C5C91236A87 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AE47FA43E61244FBA1DDA149B94CFF81 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp # Added ID for environment URL
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'insightbridge-test-app'
          slot-name: 'Production'
          package: deploy_temp # Deploy the unzipped folder content

      # This step might not be needed if deployment restarts the app, but good for ensuring it's running
      - name: Start Azure Web App (Optional - ensure running)
        run: |
          az webapp start --name insightbridge-test-app --resource-group InsightBridge-Test-RG
