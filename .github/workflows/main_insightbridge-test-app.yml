name: Build and deploy Python app to Azure Web App - insightbridge-test-app

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create virtual environment and install dependencies
        working-directory: ./backend
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Zip backend for deployment
        run: |
          cd backend
          zip -r ../backend.zip . -x "antenv/*" -x "*.pyc" -x "__pycache__/*" -x "*.db" -x "test_*.py" -x "debug_*.py"
          cd ..

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: backend.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Unzip artifact for deployment
        run: |
          unzip backend.zip
          rm backend.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C671DC860D2D4CA98A09B82E3C289B76 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_73C0753D16CA485BA2B18C5C91236A87 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AE47FA43E61244FBA1DDA149B94CFF81 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'insightbridge-test-app'
          slot-name: 'Production'
        # ADD THIS NEW STEP:
      - name: Start Azure Web App
        run: |
          az webapp start --name insightbridge-test-app --resource-group InsightBridge-Test-RG
