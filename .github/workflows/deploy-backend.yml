name: Deploy Backend to Azure App Service

on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4

      - name: 'Set up Python 3.12'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: 'Prepare deployment package'
        run: |
          cd backend
          
          # Clean up
          rm -rf __pycache__ *.pyc .pytest_cache .venv venv startup.sh
          
          # Validate
          if [ ! -f requirements.txt ]; then
            echo "ERROR: requirements.txt not found!"
            exit 1
          fi
          
          if [ ! -f app.py ]; then
            echo "ERROR: app.py not found!"
            exit 1
          fi
          
          # Create ZIP
          zip -r ../deploy.zip . \
            -x "*.git*" \
            -x "*__pycache__*" \
            -x "*.pyc" \
            -x "*.log" \
            -x ".env*"
          
          cd ..
          echo "Package size: $(du -h deploy.zip | cut -f1)"
          echo "Package contents (first 30 files):"
          unzip -l deploy.zip | head -33
      
      # Stop the app before deploying to avoid conflicts
      - name: 'Login to Azure'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: 'Stop App Service'
        run: |
          echo "Stopping app service to avoid deployment conflicts..."
          az webapp stop \
            --name insightbridge-backend-test \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} || echo "Could not stop app (may not be running)"
          
          sleep 10
      
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy
        with:
          app-name: 'insightbridge-backend-test'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: deploy.zip
          # Enable remote build
          enable-oryx-build: true
          # Clean deployment - removes old files
          clean: true
      
      - name: 'Start App Service'
        run: |
          echo "Starting app service..."
          az webapp start \
            --name insightbridge-backend-test \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }}
          
          echo "Waiting for app to start and build..."
          sleep 120
      
      - name: 'Health Check'
        run: |
          echo "=========================================="
          echo "Application Health Check"
          echo "=========================================="
          
          URL="https://insightbridge-backend-test.azurewebsites.net/health"
          
          for attempt in {1..15}; do
            echo ""
            echo "Attempt $attempt/15..."
            
            HTTP_CODE=$(curl -s -o /tmp/response -w "%{http_code}" "$URL" 2>/dev/null || echo "000")
            
            echo "HTTP Status: $HTTP_CODE"
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo ""
              echo "✅✅✅ SUCCESS! ✅✅✅"
              echo ""
              echo "Response:"
              cat /tmp/response
              echo ""
              exit 0
            fi
            
            if [ "$HTTP_CODE" = "503" ]; then
              echo "Service unavailable - may still be building..."
            elif [ "$HTTP_CODE" = "504" ]; then
              echo "Gateway timeout - app may still be starting..."
            fi
            
            if [ $attempt -lt 15 ]; then
              sleep 20
            fi
          done
          
          echo ""
          echo "=========================================="
          echo "❌ Health check failed after 15 attempts"
          echo "=========================================="
          echo ""
          echo "Last response:"
          cat /tmp/response 2>/dev/null || echo "No response received"
          echo ""
          echo "Check logs:"
          echo "https://insightbridge-backend-test.scm.azurewebsites.net/api/logs/docker"
          echo ""
          
          exit 1
