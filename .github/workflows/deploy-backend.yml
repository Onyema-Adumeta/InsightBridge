name: Deploy Backend (FastAPI)

on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Create deployment package
        run: |
          cd backend
          
          # Verify startup.sh exists
          echo "Checking for startup.sh..."
          ls -la startup.sh
          
          # Create clean package including startup.sh
          zip -r ../backend.zip . \
            -x "*.git*" \
            -x "*__pycache__*" \
            -x "*.pytest_cache*" \
            -x "*.pyc" \
            -x "*venv*" \
            -x "*.venv*" \
            -x ".env" \
            -x "*.db" \
            -x "test*.py" \
            -x "debug*.py"
          
          cd ..
          echo "✅ Package created ($(du -h backend.zip | cut -f1))"
          
          echo ""
          echo "📦 Verifying startup.sh in package:"
          unzip -l backend.zip | grep startup.sh
      
      - name: Deploy via Kudu API
        run: |
          echo "🚀 Deploying backend..."
          
          response=$(curl -X POST \
            -u '$insightbridge-backend-test:7fpDMWkLmqiWql3Ztqx93quEzpZbKW9p2mD4LngMbfXQrJSCKBw1qztmWi5q' \
            --data-binary @backend.zip \
            -H "Content-Type: application/octet-stream" \
            -w "\n%{http_code}" \
            -s \
            https://insightbridge-backend-test.scm.azurewebsites.net/api/zipdeploy)
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)
          
          echo "Response: $body"
          echo "Status code: $http_code"
          
          if [ "$http_code" = "200" ] || [ "$http_code" = "202" ]; then
            echo "✅ Deployment successful!"
            exit 0
          else
            echo "❌ Deployment failed!"
            echo "Response body: $body"
            exit 1
          fi
