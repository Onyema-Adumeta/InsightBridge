name: Deploy Backend (FastAPI)
on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # ✅ Increased from 20
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Clean build artifacts
        run: |
          echo "🧹 Cleaning unnecessary files from backend..."
          cd backend
          
          # Remove Python cache and test files
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "*.egg-info" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name ".pytest_cache" -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true
          find . -name "*.pyo" -delete 2>/dev/null || true
          find . -name ".DS_Store" -delete 2>/dev/null || true
          
          # Remove test and debug files
          rm -rf tests/ test*.py debug*.py 2>/dev/null || true
          
          cd ..
          echo "✅ Cleanup complete"
      
      - name: Create deployment package from backend folder
        run: |
          echo "📦 Creating deployment package..."
          
          cd backend
          zip -r ../backend.zip . \
            -x "*.git*" \
            -x "*__pycache__*" \
            -x "*.pytest_cache*" \
            -x "*.pyc" \
            -x "*.pyo" \
            -x "*venv*" \
            -x "*.venv*" \
            -x "*antenv*" \
            -x ".env" \
            -x "*.db" \
            -x "test*.py" \
            -x "debug*.py" \
            -x "*.egg-info*"
          
          cd ..
          
          echo "✅ Package created ($(du -h backend.zip | cut -f1))"
          echo ""
          echo "📋 Verifying package contents:"
          unzip -l backend.zip | grep -E '(requirements\.txt|app\.py|main\.py)' || echo "Warning: Key files not found"
      
      - name: Deploy to Azure with OneDeploy API
        timeout-minutes: 18  # ✅ Increased from 15
        continue-on-error: true  # ✅ NEW: Don't fail workflow on timeout
        id: deploy
        run: |
          echo "🚀 Deploying backend to Azure..."
          
          # Deploy with extended timeout
          response=$(curl -X POST \
            -u '$insightbridge-backend-test:7fpDMWkLmqiWql3Ztqx93quEzpZbKW9p2mD4LngMbfXQrJSCKBw1qztmWi5q' \
            --data-binary @backend.zip \
            -H "Content-Type: application/zip" \
            --max-time 900 \
            --connect-timeout 120 \
            -w "\n%{http_code}" \
            -s \
            'https://insightbridge-backend-test.scm.azurewebsites.net/api/publish?type=zip' 2>&1)
          
          curl_exit_code=$?
          
          # Handle curl errors
          if [ $curl_exit_code -eq 28 ]; then
            echo "⚠️  Curl timeout (exit 28) - Deployment still processing in background"
            echo "status=timeout" >> $GITHUB_OUTPUT
            exit 0  # Don't fail, Azure is still processing
          elif [ $curl_exit_code -ne 0 ]; then
            echo "❌ Curl error (exit code: $curl_exit_code)"
            echo "status=error" >> $GITHUB_OUTPUT
            exit 0  # Don't fail workflow
          fi
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)
          
          echo "HTTP Status: $http_code"
          
          if [ "$http_code" = "200" ] || [ "$http_code" = "202" ]; then
            echo "✅ Deployment accepted by Azure!"
            echo "status=accepted" >> $GITHUB_OUTPUT
          elif [ "$http_code" = "504" ]; then
            echo "⚠️  Gateway timeout (504) - Deployment likely still processing"
            echo "status=timeout" >> $GITHUB_OUTPUT
          else
            echo "⚠️  Unexpected status: $http_code"
            echo "Response: $body"
            echo "status=unknown" >> $GITHUB_OUTPUT
          fi
      
      - name: Wait for deployment to complete
        run: |
          echo ""
          echo "⏳ Waiting for Azure Oryx build to complete..."
          echo "This typically takes 2-4 minutes for backend deployments"
          echo ""
          
          # Wait longer since we know deployment takes time
          sleep 150  # 2.5 minutes
      
      - name: Verify deployment health
        timeout-minutes: 5
        run: |
          echo "🔍 Checking application health..."
          echo ""
          
          max_attempts=20
          wait_seconds=20
          
          for i in $(seq 1 $max_attempts); do
            echo "Health check attempt $i/$max_attempts..."
            
            # Try to get health status with longer timeout
            response_code=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 60 \
              --connect-timeout 10 \
              https://insightbridge-backend-test.azurewebsites.net/api/v1/main/health 2>/dev/null)
            
            curl_exit=$?
            
            if [ "$response_code" = "200" ]; then
              echo ""
              echo "✅ Application is healthy and responding!"
              echo "🎉 Deployment successful!"
              echo ""
              echo "🔗 API Documentation: https://insightbridge-backend-test.azurewebsites.net/docs"
              echo "🔗 Health endpoint: https://insightbridge-backend-test.azurewebsites.net/api/v1/main/health"
              exit 0
            elif [ "$response_code" = "503" ]; then
              echo "   App returned 503 (Service Unavailable) - still starting up..."
            elif [ $curl_exit -eq 28 ]; then
              echo "   Request timeout - app may be under heavy load..."
            elif [ $curl_exit -eq 7 ]; then
              echo "   Connection failed - app not ready yet..."
            else
              echo "   Response code: $response_code (curl exit: $curl_exit)"
            fi
            
            if [ $i -lt $max_attempts ]; then
              echo "   Waiting ${wait_seconds} seconds before next attempt..."
              sleep $wait_seconds
            fi
          done
          
          echo ""
          echo "⚠️  Health check did not pass within the timeout period"
          echo ""
          echo "This is common with large deployments. The app may still be starting."
          echo ""
          echo "📊 Next steps:"
          echo "   1. Check logs: https://insightbridge-backend-test.scm.azurewebsites.net/api/logstream"
          echo "   2. View deployment: https://portal.azure.com/"
          echo "   3. Wait 2-3 minutes and manually check: https://insightbridge-backend-test.azurewebsites.net/api/v1/main/health"
          echo ""
          echo "✅ Deployment was submitted successfully - giving Azure more time to complete"
          
          # Don't fail the workflow - deployment was accepted
          exit 0
      
      - name: Deployment summary
        if: always()
        run: |
          echo ""
          echo "================================"
          echo "🚀 Deployment Summary"
          echo "================================"
          echo "Status: Deployment submitted to Azure"
          echo "Backend: insightbridge-backend-test"
          echo "Region: Canada Central"
          echo ""
          echo "🔗 Quick Links:"
          echo "   API Docs: https://insightbridge-backend-test.azurewebsites.net/docs"
          echo "   Health: https://insightbridge-backend-test.azurewebsites.net/api/v1/main/health"
          echo "   Logs: https://insightbridge-backend-test.scm.azurewebsites.net/api/logstream"
          echo "   Portal: https://portal.azure.com/"
          echo ""
          echo "Time: $(date)"
          echo "================================"
          echo ""
          echo "💡 If health check didn't pass immediately:"
          echo "   Azure deployments can take 3-5 minutes to fully start"
          echo "   Check the app in 2-3 minutes at the health endpoint above"
