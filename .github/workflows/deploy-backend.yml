name: Deploy Backend (FastAPI)

on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'insightbridge-backend-test'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: './backend'
      
      - name: Wait for deployment to complete
        run: |
          echo "⏳ Waiting for app to start..."
          sleep 30
          
          echo "🔍 Checking health endpoint..."
          for i in {1..5}; do
            if curl -f -s https://insightbridge-backend-test.azurewebsites.net/api/v1/main/health > /dev/null; then
              echo "✅ Application is healthy!"
              exit 0
            fi
            echo "Attempt $i failed, waiting..."
            sleep 10
          done
          
          echo "⚠️ Health check timeout - check logs in Azure Portal"
