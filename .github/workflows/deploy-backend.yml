name: Deploy Backend (FastAPI)

on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Zip backend source
        run: |
          zip -r backend.zip . -x ".git/*" "__pycache__/*" ".pytest_cache/*"
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-src
          path: backend/backend.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-src
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BACKEND }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BACKEND }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BACKEND }}
      
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "insightbridge-backend-test"
          slot-name: "Production"
          package: backend.zip
      
      - name: Azure logout
        run: az logout
