name: Deploy Backend (FastAPI)

on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Create deployment package
        run: |
          cd backend
          
          # Create clean package
          zip -r ../backend.zip . \
            -x "*.git*" \
            -x "*__pycache__*" \
            -x "*.pytest_cache*" \
            -x "*.pyc" \
            -x "*venv*" \
            -x "*.venv*" \
            -x ".env" \
            -x "*.db" \
            -x "test*.py" \
            -x "debug*.py"
          
          cd ..
          echo "✅ Package created ($(du -h backend.zip | cut -f1))"
          echo ""
          echo "📦 Package contents:"
          unzip -l backend.zip
      
      - name: Get detailed error from Kudu
        run: |
          echo "🚀 Attempting deployment with verbose output..."
          
          curl -v -X POST \
            -u '$insightbridge-backend-test:7fpDMWkLmqiWql3Ztqx93quEzpZbKW9p2mD4LngMbfXQrJSCKBw1qztmWi5q' \
            --data-binary @backend.zip \
            -H "Content-Type: application/octet-stream" \
            -o response.txt \
            -w "HTTP Status: %{http_code}\n" \
            https://insightbridge-backend-test.scm.azurewebsites.net/api/zipdeploy 2>&1 | tee deploy.log
          
          echo ""
          echo "📄 Response body:"
          cat response.txt
          
          echo ""
          echo "🔍 Checking deployment logs..."
          curl -u '$insightbridge-backend-test:7fpDMWkLmqiWql3Ztqx93quEzpZbKW9p2mD4LngMbfXQrJSCKBw1qztmWi5q' \
            https://insightbridge-backend-test.scm.azurewebsites.net/api/deployments/latest
