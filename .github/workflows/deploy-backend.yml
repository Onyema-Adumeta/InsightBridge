name: Deploy Backend (FastAPI)

on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Zip backend source
        run: |
          cd backend
          zip -r ../backend.zip . -x ".git/*" "__pycache__/*" ".pytest_cache/*" "*.pyc" ".venv/*" "venv/*"
      
      - name: Azure Login for cleanup
        uses: azure/login@v1
        with:
          creds: '{"clientId":"${{ secrets.AZUREAPPSERVICE_CLIENTID_BACKEND }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BACKEND }}","tenantId":"${{ secrets.AZUREAPPSERVICE_TENANTID_BACKEND }}"}'
      
      - name: Force cleanup and restart
        run: |
          echo "Stopping app..."
          az webapp stop --name insightbridge-backend-test --resource-group InsightBridge-Test-RG || true
          
          echo "Waiting..."
          sleep 15
          
          echo "Restarting app..."
          az webapp restart --name insightbridge-backend-test --resource-group InsightBridge-Test-RG || true
          
          echo "Waiting for restart..."
          sleep 15
      
      - name: Azure logout
        run: az logout
        if: always()
      
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'insightbridge-backend-test'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_BACKEND }}
          package: backend.zip
