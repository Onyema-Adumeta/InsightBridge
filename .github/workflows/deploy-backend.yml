name: Deploy Backend to Azure

on:
  # Triggers the workflow on push events to the 'main' branch
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  # Allows manual running from the GitHub Actions UI
  workflow_dispatch:

jobs:
  deploy:
    # Use a Linux runner for Python/Gunicorn deployments to Azure Linux App Service
    runs-on: ubuntu-latest
    
    environment: Production # Optional: Use an environment for protection rules and tracking
    
    steps:
      - name: ⬇️ Checkout repository code
        uses: actions/checkout@v4
        
      - name: 🐍 Set up Python 3.12 and Cache Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'
          
      - name: 📦 Install and Validate Code
        run: |
          echo "Installing dependencies and running syntax check..."
          
          # Change directory and install
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
          # Syntax validation (runs after installation to ensure environment is complete)
          python -m py_compile app.py || { echo "::warning file=app.py::Python Syntax check failed for app.py"; }
      
      - name: 🔨 Create Deployment ZIP Package
        id: create_package
        run: |
          # 1. Create startup script in the backend directory
          cat > backend/startup.sh << 'EOF'
#!/bin/bash
# Azure will execute this script to start the Gunicorn/Uvicorn server
echo "Starting InsightBridge Backend..."
gunicorn app:app \
--workers 4 \
--worker-class uvicorn.workers.UvicornWorker \
--bind 0.0.0.0:$PORT \
--timeout 300 \
--keep-alive 5 \
--access-logfile - \
--error-logfile - \
--log-level info
EOF
          chmod +x backend/startup.sh
          
          # 2. Create the ZIP file directly from the 'backend' directory contents
          # -r: recursive, -j: junk path names (to keep the files at the root of the zip), 
          # -x: exclude files
          cd backend
          zip -r deployment.zip . -x "*.git*" "*__pycache__*" "*.DS_Store" "deployment"
          echo "ZIP_PATH=./backend/deployment.zip" >> $GITHUB_OUTPUT

      - name: 🚀 Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'insightbridge-backend-test'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          # Use the ZIP file created in the previous step
          package: ${{ steps.create_package.outputs.ZIP_PATH }}
          # Recommended: Set the startup command explicitly for Azure Linux App Service
          startup-command: './startup.sh' 

      - name: 🩺 Post-deployment Health Check
        # Uses the built-in 'shell' step for robust HTTP checks
        shell: bash
        run: |
          APP_URL="https://insightbridge-backend-test.azurewebsites.net/health"
          MAX_RETRIES=6 # Retry up to 6 times
          WAIT_TIME=10  # Wait 10 seconds between retries (total wait time is 60s)
          
          echo "Waiting for service to start and checking endpoint: $APP_URL"

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES..."
            
            # Check health endpoint, silent mode, output HTTP status code
            response=$(curl -s -o /dev/null -w "%{http_code}" $APP_URL)
            
            if [ "$response" = "200" ]; then
              echo "✅ Health check passed! Status: $response"
              exit 0 # Success
            else
              echo "⚠️ Health check returned status: $response. Retrying in $WAIT_TIME seconds..."
              sleep $WAIT_TIME
            fi
          done

          # If the loop finishes without exiting, the health check failed.
          echo "❌ ERROR: Health check failed after $MAX_RETRIES attempts."
          exit 1
