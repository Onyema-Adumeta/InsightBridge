name: Deploy Backend to Azure (Working Solution)
on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Prepare backend source for deployment
        run: |
          cd backend
          
          # Clean any local dev artifacts
          rm -rf .venv venv env .python_packages __pycache__ *.pyc
          
          # Remove startup.sh - we'll use Azure Portal startup command
          rm -f startup.sh
          
          # Create clean deployment package
          zip -r ../app.zip . -x "*.git*" "*__pycache__*" "*.pyc"
          
          cd ..
          echo "Deployment package created"
          unzip -l app.zip | grep -E "(app\.py|requirements\.txt)" || echo "WARNING: Key files missing!"
      
      - name: Deploy using Azure Web App Deploy with proper settings
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'insightbridge-backend-test'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: 'app.zip'
      
      # Critical: Add delay for Oryx build to complete
      - name: Wait for Oryx build to complete
        run: |
          echo "================================================"
          echo "Waiting for Azure Oryx build to complete..."
          echo "================================================"
          echo ""
          echo "Azure should now be:"
          echo "1. Extracting the deployment package"
          echo "2. Detecting Python project (requirements.txt)"
          echo "3. Running: pip install -r requirements.txt"
          echo "4. Creating virtual environment"
          echo "5. Starting the application"
          echo ""
          echo "This typically takes 60-120 seconds..."
          echo ""
          
          # Wait for build + startup
          sleep 120
      
      - name: Application health check
        run: |
          APP_URL="https://insightbridge-backend-test.azurewebsites.net/health"
          MAX_ATTEMPTS=15
          WAIT_BETWEEN=10
          
          echo "================================================"
          echo "Health Check Starting"
          echo "================================================"
          echo "Endpoint: $APP_URL"
          echo "Max attempts: $MAX_ATTEMPTS"
          echo ""
          
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "[$i/$MAX_ATTEMPTS] Checking..."
            
            # Make request
            HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" "$APP_URL" 2>/dev/null || echo "000")
            
            # Check result
            if [ "$HTTP_CODE" = "200" ]; then
              echo ""
              echo "✅✅✅ SUCCESS! ✅✅✅"
              echo ""
              echo "Application is healthy and responding!"
              echo ""
              echo "Response body:"
              cat /tmp/response.txt
              echo ""
              echo "================================================"
              exit 0
            fi
            
            # Log failure
            echo "   Status: $HTTP_CODE (Expected: 200)"
            
            # Show error details for debugging
            if [ "$HTTP_CODE" = "503" ] || [ "$HTTP_CODE" = "500" ]; then
              echo "   Error detected. Response preview:"
              head -3 /tmp/response.txt 2>/dev/null | sed 's/^/   /'
            fi
            
            # Wait before retry
            if [ $i -lt $MAX_ATTEMPTS ]; then
              echo "   Waiting ${WAIT_BETWEEN}s before retry..."
              sleep $WAIT_BETWEEN
            fi
          done
          
          # All attempts failed
          echo ""
          echo "================================================"
          echo "❌ HEALTH CHECK FAILED ❌"
          echo "================================================"
          echo ""
          echo "Application did not become healthy after $MAX_ATTEMPTS attempts."
          echo ""
          echo "🔍 Troubleshooting Steps:"
          echo ""
          echo "1. Check application logs:"
          echo "   https://insightbridge-backend-test.scm.azurewebsites.net/api/logs/docker"
          echo ""
          echo "2. Verify build ran successfully in Kudu Console:"
          echo "   https://insightbridge-backend-test.scm.azurewebsites.net"
          echo "   Then run:"
          echo "     cd /home/site/wwwroot"
          echo "     ls -la oryx-manifest.toml  # Should exist if build ran"
          echo "     ls -la antenv/             # Virtual environment"
          echo "     python -m pip list         # Installed packages"
          echo ""
          echo "3. Check Configuration in Azure Portal:"
          echo "   - SCM_DO_BUILD_DURING_DEPLOYMENT = true"
          echo "   - WEBSITES_PORT = 8000"
          echo "   - WEBSITE_RUN_FROM_PACKAGE = 0 (or not set)"
          echo "   - Startup Command = gunicorn app:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000"
          echo ""
          echo "4. Latest error response:"
          cat /tmp/response.txt 2>/dev/null | head -20
          echo ""
          echo "================================================"
          
          exit 1
