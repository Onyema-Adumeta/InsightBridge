name: Deploy Backend to Azure

on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Create deployment package
        run: |
          cd backend
          
          # Clean artifacts
          rm -rf __pycache__ *.pyc .venv venv startup.sh .pytest_cache
          
          # Create ZIP
          zip -r ../backend-deploy.zip . -x "*.git*" "*__pycache__*" "*.pyc" "*.log" ".env*"
          
          cd ..
          echo "Package created: $(du -h backend-deploy.zip | cut -f1)"
      
      - name: Deploy using Kudu ZIP Deploy (with retries)
        env:
          PUBLISH_PROFILE: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
        run: |
          # Extract credentials from publish profile
          USERNAME=$(echo "$PUBLISH_PROFILE" | grep -oP '(?<=userName=")[^"]+' | head -1)
          PASSWORD=$(echo "$PUBLISH_PROFILE" | grep -oP '(?<=userPWD=")[^"]+' | head -1)
          
          if [ -z "$USERNAME" ] || [ -z "$PASSWORD" ]; then
            echo "❌ Failed to extract credentials"
            exit 1
          fi
          
          echo "✅ Credentials extracted"
          
          # Kudu ZIP Deploy endpoint
          DEPLOY_URL="https://insightbridge-backend-test.scm.azurewebsites.net/api/zipdeploy"
          
          echo ""
          echo "================================================"
          echo "Deploying to Azure App Service..."
          echo "================================================"
          echo ""
          
          # Try deployment with retries (to handle temporary 409s)
          MAX_RETRIES=3
          RETRY_COUNT=0
          SUCCESS=false
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Deployment attempt $RETRY_COUNT/$MAX_RETRIES..."
            
            # Deploy with async=false to wait for completion
            HTTP_CODE=$(curl -X POST "${DEPLOY_URL}?isAsync=false" \
              -u "$USERNAME:$PASSWORD" \
              -H "Content-Type: application/zip" \
              --data-binary @backend-deploy.zip \
              --max-time 600 \
              -w "%{http_code}" \
              -o /tmp/deploy_output.txt \
              -s)
            
            echo "Response: HTTP $HTTP_CODE"
            
            # Check response
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
              echo "✅ Deployment successful!"
              SUCCESS=true
              break
            elif [ "$HTTP_CODE" = "409" ]; then
              echo "⚠️  Conflict detected (app may be locked)"
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "Waiting 30 seconds before retry..."
                sleep 30
              fi
            elif [ "$HTTP_CODE" = "504" ]; then
              echo "⚠️  Gateway timeout (deployment may still be processing)"
              echo "Waiting to see if deployment completes..."
              sleep 60
              # Check if deployment actually succeeded despite timeout
              SUCCESS=true
              break
            else
              echo "❌ Deployment failed with HTTP $HTTP_CODE"
              if [ -f /tmp/deploy_output.txt ]; then
                cat /tmp/deploy_output.txt
              fi
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "Retrying in 20 seconds..."
                sleep 20
              fi
            fi
          done
          
          if [ "$SUCCESS" = false ]; then
            echo ""
            echo "❌ Deployment failed after $MAX_RETRIES attempts"
            exit 1
          fi
          
          echo ""
          echo "================================================"
          echo "Waiting for Oryx build to complete..."
          echo "================================================"
          echo ""
          echo "Azure is now:"
          echo "  • Detecting Python project"
          echo "  • Creating virtual environment"
          echo "  • Installing: pip install -r requirements.txt"
          echo "  • Starting application"
          echo ""
          echo "⏳ Estimated time: 2-3 minutes"
          echo ""
          
          sleep 150
      
      - name: Application Health Check
        run: |
          echo "================================================"
          echo "Health Check"
          echo "================================================"
          echo ""
          
          URL="https://insightbridge-backend-test.azurewebsites.net/health"
          MAX_ATTEMPTS=25
          WAIT_TIME=12
          
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Attempt $attempt/$MAX_ATTEMPTS"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            HTTP_CODE=$(curl -s -o /tmp/health_response.txt -w "%{http_code}" "$URL" --max-time 30 2>/dev/null || echo "000")
            
            echo "HTTP Status: $HTTP_CODE"
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo ""
              echo "✅✅✅ SUCCESS! Application is healthy! ✅✅✅"
              echo ""
              echo "Response:"
              cat /tmp/health_response.txt
              echo ""
              echo ""
              echo "🎉 Deployment completed successfully!"
              echo ""
              exit 0
            fi
            
            # Provide context for common error codes
            case $HTTP_CODE in
              000)
                echo "   → Connection failed or timeout"
                ;;
              502)
                echo "   → Bad Gateway (app may have crashed)"
                ;;
              503)
                echo "   → Service Unavailable (likely still building/starting)"
                ;;
              504)
                echo "   → Gateway Timeout (app taking long to start)"
                ;;
              *)
                echo "   → Unexpected response"
                if [ -f /tmp/health_response.txt ] && [ -s /tmp/health_response.txt ]; then
                  echo "   Preview:"
                  head -2 /tmp/health_response.txt | sed 's/^/   /'
                fi
                ;;
            esac
            
            if [ $attempt -lt $MAX_ATTEMPTS ]; then
              echo ""
              echo "⏳ Waiting ${WAIT_TIME}s before next attempt..."
              sleep $WAIT_TIME
            fi
          done
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "❌ Health check failed after $MAX_ATTEMPTS attempts"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "🔍 Troubleshooting Resources:"
          echo ""
          echo "1. Application Logs:"
          echo "   https://insightbridge-backend-test.scm.azurewebsites.net/api/logs/docker"
          echo ""
          echo "2. Kudu Console (verify build):"
          echo "   https://insightbridge-backend-test.scm.azurewebsites.net"
          echo "   Commands:"
          echo "   $ cd /home/site/wwwroot"
          echo "   $ ls -la oryx-manifest.toml"
          echo "   $ python -m pip list | grep uvicorn"
          echo ""
          echo "3. Azure Portal:"
          echo "   https://portal.azure.com"
          echo "   → Configuration → Application settings"
          echo "   Verify: SCM_DO_BUILD_DURING_DEPLOYMENT=true"
          echo ""
          echo "4. Last response received:"
          if [ -f /tmp/health_response.txt ]; then
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            head -50 /tmp/health_response.txt
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          else
            echo "   (No response file)"
          fi
          echo ""
          
          exit 1
