name: Deploy Backend (FastAPI)
on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # ✅ Added: Increase overall job timeout
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Clean build artifacts
        run: |
          echo "🧹 Cleaning unnecessary files from backend..."
          cd backend
          
          # Remove Python cache and test files
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "*.egg-info" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name ".pytest_cache" -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true
          find . -name "*.pyo" -delete 2>/dev/null || true
          find . -name ".DS_Store" -delete 2>/dev/null || true
          
          # Remove test and debug files
          rm -rf tests/ test*.py debug*.py 2>/dev/null || true
          
          cd ..
          echo "✅ Cleanup complete"
      
      - name: Create deployment package from backend folder
        run: |
          echo "📦 Creating deployment package..."
          
          # Navigate into backend folder and zip its CONTENTS (not the folder itself)
          cd backend
          zip -r ../backend.zip . \
            -x "*.git*" \
            -x "*__pycache__*" \
            -x "*.pytest_cache*" \
            -x "*.pyc" \
            -x "*.pyo" \
            -x "*venv*" \
            -x "*.venv*" \
            -x "*antenv*" \
            -x ".env" \
            -x "*.db" \
            -x "test*.py" \
            -x "debug*.py" \
            -x "*.egg-info*"
          
          cd ..
          
          echo "✅ Package created ($(du -h backend.zip | cut -f1))"
          echo ""
          echo "📋 Verifying package contents:"
          unzip -l backend.zip | grep -E '(requirements\.txt|app\.py|main\.py)' || echo "Warning: Key files not found"
      
      - name: Deploy to Azure with OneDeploy API
        timeout-minutes: 15  # ✅ Added: Step-specific timeout
        run: |
          echo "🚀 Deploying backend to Azure..."
          
          # Use OneDeploy API which triggers Oryx build with increased timeout
          response=$(curl -X POST \
            -u '$insightbridge-backend-test:7fpDMWkLmqiWql3Ztqx93quEzpZbKW9p2mD4LngMbfXQrJSCKBw1qztmWi5q' \
            --data-binary @backend.zip \
            -H "Content-Type: application/zip" \
            --max-time 600 \
            -w "\n%{http_code}" \
            -s \
            'https://insightbridge-backend-test.scm.azurewebsites.net/api/publish?type=zip')
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)
          
          echo "HTTP Status: $http_code"
          
          if [ "$http_code" = "200" ] || [ "$http_code" = "202" ]; then
            echo "✅ Deployment accepted by Azure!"
            echo ""
            echo "⏳ Waiting for Oryx build to complete (this takes 90-120 seconds)..."
            sleep 100  # ✅ Increased: Give Oryx more time to build
            
            echo ""
            echo "🔍 Checking application health..."
            
            # ✅ Increased: More attempts with longer waits
            for i in {1..15}; do
              response_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://insightbridge-backend-test.azurewebsites.net/api/v1/main/health)
              
              if [ "$response_code" = "200" ]; then
                echo "✅ Application is healthy and responding!"
                echo "🎉 Deployment successful!"
                echo ""
                echo "🔗 View your API at: https://insightbridge-backend-test.azurewebsites.net/docs"
                echo "🔗 Health endpoint: https://insightbridge-backend-test.azurewebsites.net/api/v1/main/health"
                exit 0
              fi
              
              echo "Attempt $i/15: Health check returned $response_code, waiting..."
              sleep 15  # ✅ Increased: Longer wait between attempts
            done
            
            echo "⚠️  Health check timeout - app may still be starting"
            echo "📊 Check logs at: https://insightbridge-backend-test.scm.azurewebsites.net/api/logstream"
            echo "📊 Deployment center: https://portal.azure.com/"
            
            # ✅ Don't fail the workflow if health check times out
            # The deployment was accepted, app just needs more time to start
            echo ""
            echo "✅ Deployment completed - app may need a few more minutes to fully start"
            exit 0
          elif [ "$http_code" = "504" ]; then
            echo "⚠️  Gateway timeout (504) - This is common with large deployments"
            echo "The deployment may still be processing in the background..."
            echo ""
            echo "🔄 Waiting an additional 60 seconds..."
            sleep 60
            
            # Check if the app eventually comes up
            response_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://insightbridge-backend-test.azurewebsites.net/api/v1/main/health)
            
            if [ "$response_code" = "200" ]; then
              echo "✅ Application recovered and is now healthy!"
              exit 0
            else
              echo "⚠️  App not responding yet - check Azure Portal for status"
              echo "📊 Portal: https://portal.azure.com/"
              # Don't fail - let Azure finish processing
              exit 0
            fi
          else
            echo "❌ Deployment failed!"
            echo "Response: $body"
            exit 1
          fi
      
      - name: Deployment summary
        if: always()
        run: |
          echo ""
          echo "================================"
          echo "🚀 Deployment Summary"
          echo "================================"
          echo "Backend: insightbridge-backend-test"
          echo "Region: Canada Central"
          echo "API Docs: https://insightbridge-backend-test.azurewebsites.net/docs"
          echo "Health: https://insightbridge-backend-test.azurewebsites.net/api/v1/main/health"
          echo "Logs: https://insightbridge-backend-test.scm.azurewebsites.net/api/logstream"
          echo "Time: $(date)"
          echo "================================"
