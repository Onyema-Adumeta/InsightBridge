name: Deploy Backend (FastAPI)

on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Create deployment package
        run: |
          cd backend
          
          echo "Checking required files..."
          ls -la requirements.txt app.py
          
          # Create deployment package
          zip -r ../backend.zip . \
            -x "*.git*" \
            -x "*__pycache__*" \
            -x "*.pytest_cache*" \
            -x "*.pyc" \
            -x "*venv*" \
            -x "*.venv*" \
            -x "*antenv*" \
            -x ".env" \
            -x "*.db" \
            -x "test*.py" \
            -x "debug*.py"
          
          cd ..
          echo "✅ Package created ($(du -h backend.zip | cut -f1))"
      
      - name: Deploy with build enabled
        run: |
          echo "🚀 Deploying backend with build..."
          
          # Use zipdeploy with SCM_DO_BUILD_DURING_DEPLOYMENT flag
          response=$(curl -X POST \
            -u '$insightbridge-backend-test:7fpDMWkLmqiWql3Ztqx93quEzpZbKW9p2mD4LngMbfXQrJSCKBw1qztmWi5q' \
            --data-binary @backend.zip \
            -H "Content-Type: application/octet-stream" \
            -w "\n%{http_code}" \
            -s \
            'https://insightbridge-backend-test.scm.azurewebsites.net/api/zipdeploy?isAsync=true&scm_do_build_during_deployment=true')
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)
          
          echo "Response: $body"
          echo "Status code: $http_code"
          
          if [ "$http_code" = "200" ] || [ "$http_code" = "202" ]; then
            echo "✅ Deployment initiated!"
            
            # Wait for deployment to complete
            echo "⏳ Waiting for deployment to finish..."
            sleep 60
            
            echo "🔍 Checking application..."
            for i in {1..10}; do
              if curl -f -s https://insightbridge-backend-test.azurewebsites.net/api/v1/main/health > /dev/null; then
                echo "✅ Application is healthy!"
                exit 0
              fi
              echo "Attempt $i failed, waiting..."
              sleep 15
            done
            
            echo "⚠️ App might still be starting - check Azure logs"
            exit 0
          else
            echo "❌ Deployment failed!"
            echo "Response body: $body"
            exit 1
          fi
