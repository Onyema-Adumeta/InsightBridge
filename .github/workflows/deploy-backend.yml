name: Deploy Backend (FastAPI)

on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create deployment package
        run: |
          cd backend
          
          # Create clean package excluding unnecessary files
          zip -r ../backend.zip . \
            -x "*.git*" \
            -x "*__pycache__*" \
            -x "*.pytest_cache*" \
            -x "*.pyc" \
            -x "*venv*" \
            -x "*.venv*" \
            -x ".env" \
            -x "*.db" \
            -x "test*.py" \
            -x "debug*.py"
          
          cd ..
          echo "✅ Package created"
          unzip -l backend.zip | head -30
      
      - name: Deploy via Kudu API
        run: |
          echo "🚀 Starting deployment..."
          
          response=$(curl -X POST \
            -u '$insightbridge-backend-test:7fpDMWkLmqiWql3Ztqx93quEzpZbKW9p2mD4LngMbfXQrJSCKBw1qztmWi5q' \
            --data-binary @backend.zip \
            -H "Content-Type: application/octet-stream" \
            -w "\n%{http_code}" \
            -s \
            https://insightbridge-backend-test.scm.azurewebsites.net/api/zipdeploy)
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)
          
          echo "Response: $body"
          echo "Status code: $http_code"
          
          if [ "$http_code" = "200" ] || [ "$http_code" = "202" ]; then
            echo "✅ Deployment successful!"
            exit 0
          else
            echo "❌ Deployment failed!"
            echo "Response body: $body"
            exit 1
          fi
      
      - name: Verify deployment
        run: |
          echo "Waiting for app to start..."
          sleep 15
          
          status_code=$(curl -s -o /dev/null -w "%{http_code}" https://insightbridge-backend-test.azurewebsites.net)
          
          if [ "$status_code" = "200" ] || [ "$status_code" = "404" ]; then
            echo "✅ App is responding (Status: $status_code)"
          else
            echo "⚠️  App returned status: $status_code"
          fi
