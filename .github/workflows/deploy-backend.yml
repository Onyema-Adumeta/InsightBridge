name: Deploy Backend (FastAPI)

on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Zip backend source
        run: |
          cd backend
          zip -r ../backend.zip . -x ".git/*" "__pycache__/*" ".pytest_cache/*" "*.pyc" ".venv/*" "venv/*"
      
      - name: Deploy directly via Kudu ZipDeploy API
        run: |
          echo "Deploying to Kudu..."
          response=$(curl -X POST \
            -u '$insightbridge-backend-test:7fpDMWkLmqiWql3Ztqx93quEzpZbKW9p2mD4LngMbfXQrJSCKBw1qztmWi5q' \
            --data-binary @backend.zip \
            -H "Content-Type: application/zip" \
            -w "\n%{http_code}" \
            https://insightbridge-backend-test.scm.azurewebsites.net/api/zipdeploy)
          
          http_code=$(echo "$response" | tail -n1)
          
          if [ "$http_code" -eq 200 ] || [ "$http_code" -eq 202 ]; then
            echo "✅ Deployment successful! Status code: $http_code"
          else
            echo "❌ Deployment failed with status code: $http_code"
            echo "$response"
            exit 1
          fi
          
          echo "Waiting for deployment to complete..."
          sleep 20
          
          echo "Checking deployment status..."
          curl -u '$insightbridge-backend-test:7fpDMWkLmqiWql3Ztqx93quEzpZbKW9p2mD4LngMbfXQrJSCKBw1qztmWi5q' \
            https://insightbridge-backend-test.scm.azurewebsites.net/api/deployments/latest
