name: Deploy Backend (Stop/Deploy/Start)

on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Create deployment package
        run: |
          cd backend
          rm -rf __pycache__ *.pyc .venv venv startup.sh
          zip -r ../app.zip . -x "*.git*" "*__pycache__*" "*.pyc"
          cd ..
          echo "Package: $(du -h app.zip | cut -f1)"
      
      - name: Stop app, deploy, and start using Kudu API
        env:
          PUBLISH_PROFILE: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
        run: |
          # Extract credentials
          USERNAME=$(echo "$PUBLISH_PROFILE" | grep -oP '(?<=userName=")[^"]+' | head -1)
          PASSWORD=$(echo "$PUBLISH_PROFILE" | grep -oP '(?<=userPWD=")[^"]+' | head -1)
          
          KUDU_URL="https://insightbridge-backend-test.scm.azurewebsites.net"
          
          echo "================================================"
          echo "Step 1: Stopping application..."
          echo "================================================"
          
          # Stop the app to prevent 409 conflicts
          curl -X POST "$KUDU_URL/api/app/stop" \
            -u "$USERNAME:$PASSWORD" \
            -s || echo "Stop command sent"
          
          echo "Waiting 15 seconds for app to stop..."
          sleep 15
          
          echo ""
          echo "================================================"
          echo "Step 2: Deploying package..."
          echo "================================================"
          
          # Deploy via ZIP Deploy
          HTTP_CODE=$(curl -X POST "$KUDU_URL/api/zipdeploy?isAsync=false" \
            -u "$USERNAME:$PASSWORD" \
            -H "Content-Type: application/zip" \
            --data-binary @app.zip \
            -w "%{http_code}" \
            -o /tmp/deploy.txt \
            -s)
          
          echo "Deploy Response: $HTTP_CODE"
          
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
            echo "✅ Deployment successful"
          else
            echo "❌ Deployment failed: $HTTP_CODE"
            cat /tmp/deploy.txt 2>/dev/null
            exit 1
          fi
          
          echo ""
          echo "================================================"
          echo "Step 3: Starting application..."
          echo "================================================"
          
          # Start the app
          curl -X POST "$KUDU_URL/api/app/start" \
            -u "$USERNAME:$PASSWORD" \
            -s || echo "Start command sent"
          
          echo "Waiting for app to start and build..."
          sleep 150
      
      - name: Health Check
        run: |
          URL="https://insightbridge-backend-test.azurewebsites.net/health"
          
          echo "Testing: $URL"
          echo ""
          
          for i in {1..20}; do
            echo "[$i/20] Testing..."
            
            STATUS=$(curl -s -o /tmp/health -w "%{http_code}" "$URL" || echo "000")
            
            if [ "$STATUS" = "200" ]; then
              echo ""
              echo "✅ Success!"
              cat /tmp/health
              echo ""
              exit 0
            fi
            
            echo "  Status: $STATUS"
            
            if [ $i -lt 20 ]; then
              sleep 15
            fi
          done
          
          echo ""
          echo "❌ Failed"
          exit 1
