name: Deploy Backend to Azure
on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Create deployment ZIP package
        id: create_package
        run: |
          echo "Creating deployment package..."
          cd backend
          
          # Clean local artifacts
          rm -rf .venv venv env .python_packages __pycache__ *.pyc startup.sh
          
          # Package source code and requirements only
          zip -r deployment.zip . -x "*.git*" "*__pycache__*" "*.pyc" "*.DS_Store"
          
          echo "ZIP_PATH=$(pwd)/deployment.zip" >> "$GITHUB_OUTPUT"
      
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "insightbridge-backend-test"
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: ${{ steps.create_package.outputs.ZIP_PATH }}
      
      - name: Post-deployment health check
        run: |
          APP_URL="https://insightbridge-backend-test.azurewebsites.net/health"
          echo "Waiting 45 seconds for deployment and build..."
          sleep 45
          
          for i in {1..10}; do
            echo "Health check attempt $i/10..."
            response=$(curl -s -o /tmp/response -w "%{http_code}" "$APP_URL" || echo "000")
            
            if [ "$response" = "200" ]; then
              echo "✅ Success!"
              exit 0
            fi
            
            echo "Status: $response - Retrying in 15s..."
            sleep 15
          done
          
          echo "❌ Health check failed"
          exit 1
