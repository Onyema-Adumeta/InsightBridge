name: Deploy Backend to Azure

on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Create deployment package from backend folder ONLY
        run: |
          echo "================================================"
          echo "Creating deployment package..."
          echo "================================================"
          echo ""
          
          # CRITICAL: Only package contents of backend/ folder
          cd backend
          
          echo "Files being packaged:"
          ls -la
          echo ""
          
          # Clean artifacts
          rm -rf __pycache__ *.pyc .venv venv env .pytest_cache startup.sh
          
          # Verify critical files exist
          if [ ! -f "app.py" ]; then
            echo "❌ ERROR: app.py not found in backend folder!"
            exit 1
          fi
          
          if [ ! -f "requirements.txt" ]; then
            echo "❌ ERROR: requirements.txt not found in backend folder!"
            exit 1
          fi
          
          echo "✅ Found app.py and requirements.txt"
          echo ""
          
          # Create ZIP with ONLY backend folder contents
          zip -r ../deploy.zip . -x "*.git*" "*__pycache__*" "*.pyc" "*.log" ".env*"
          
          cd ..
          
          echo "Package size: $(du -h deploy.zip | cut -f1)"
          echo ""
          echo "Package contents (first 40 lines):"
          unzip -l deploy.zip | head -43
          echo ""
      
      - name: Deploy to Azure using Kudu API
        env:
          PUBLISH_PROFILE: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
        run: |
          echo "================================================"
          echo "Extracting credentials..."
          echo "================================================"
          
          # Extract credentials
          USERNAME=$(echo "$PUBLISH_PROFILE" | grep -oP '(?<=userName=")[^"]+' | head -1)
          PASSWORD=$(echo "$PUBLISH_PROFILE" | grep -oP '(?<=userPWD=")[^"]+' | head -1)
          
          if [ -z "$USERNAME" ] || [ -z "$PASSWORD" ]; then
            echo "❌ Failed to extract credentials"
            exit 1
          fi
          
          echo "✅ Credentials extracted successfully"
          echo ""
          
          echo "================================================"
          echo "Deploying to Azure..."
          echo "================================================"
          echo ""
          
          # Deploy with retries
          MAX_RETRIES=5
          RETRY_COUNT=0
          SUCCESS=false
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" = false ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            
            echo "📤 Deployment attempt $RETRY_COUNT/$MAX_RETRIES..."
            echo ""
            
            # Use Kudu zipdeploy API
            HTTP_CODE=$(curl -X POST \
              "https://insightbridge-backend-test.scm.azurewebsites.net/api/zipdeploy" \
              -u "$USERNAME:$PASSWORD" \
              -H "Content-Type: application/zip" \
              --data-binary @deploy.zip \
              --max-time 600 \
              -w "%{http_code}" \
              -o /tmp/deploy_response.txt \
              -s)
            
            echo "Response Code: $HTTP_CODE"
            
            # Handle different response codes
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
              echo "✅ Deployment successful!"
              SUCCESS=true
              
            elif [ "$HTTP_CODE" = "409" ]; then
              echo "⚠️  Conflict (409) - App may be locked"
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "   Waiting 45 seconds before retry..."
                sleep 45
              fi
              
            elif [ "$HTTP_CODE" = "504" ]; then
              echo "⚠️  Gateway timeout (504)"
              echo "   Deployment may still be processing..."
              echo "   Continuing to health check phase..."
              SUCCESS=true
              
            else
              echo "❌ Unexpected response: $HTTP_CODE"
              if [ -f /tmp/deploy_response.txt ]; then
                echo "   Response:"
                cat /tmp/deploy_response.txt | head -10
              fi
              
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "   Waiting 30 seconds before retry..."
                sleep 30
              fi
            fi
            
            echo ""
          done
          
          if [ "$SUCCESS" = false ]; then
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "❌ Deployment failed after $MAX_RETRIES attempts"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            exit 1
          fi
          
          echo "================================================"
          echo "Waiting for Oryx build..."
          echo "================================================"
          echo ""
          echo "Azure is now:"
          echo "  • Extracting package"
          echo "  • Detecting Python app (requirements.txt)"
          echo "  • Creating virtual environment"
          echo "  • Installing dependencies: pip install -r requirements.txt"
          echo "  • Generating oryx-manifest.toml"
          echo "  • Starting application with Gunicorn + Uvicorn"
          echo ""
          echo "⏳ Estimated time: 2-3 minutes"
          echo ""
          
          # Wait for build and startup
          sleep 180
      
      - name: Health Check with Extended Timeout
        run: |
          echo "================================================"
          echo "Application Health Check"
          echo "================================================"
          echo ""
          
          URL="https://insightbridge-backend-test.azurewebsites.net/health"
          MAX_ATTEMPTS=30
          WAIT_TIME=15
          
          echo "Endpoint: $URL"
          echo "Max attempts: $MAX_ATTEMPTS"
          echo "Total timeout: $((MAX_ATTEMPTS * WAIT_TIME / 60)) minutes"
          echo ""
          
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            printf "[$attempt/$MAX_ATTEMPTS] "
            
            HTTP_CODE=$(curl -s -o /tmp/health.txt -w "%{http_code}" "$URL" --max-time 30 2>/dev/null || echo "000")
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ SUCCESS!"
              echo ""
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "🎉 Application is healthy and responding!"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo ""
              echo "Response:"
              cat /tmp/health.txt
              echo ""
              echo ""
              echo "✅ Deployment completed successfully!"
              echo ""
              exit 0
            fi
            
            # Show status with context
            case $HTTP_CODE in
              503) echo "503 Service Unavailable (building...)" ;;
              504) echo "504 Gateway Timeout (starting...)" ;;
              502) echo "502 Bad Gateway (crashed?)" ;;
              000) echo "000 Connection failed" ;;
              *) echo "$HTTP_CODE" ;;
            esac
            
            if [ $attempt -lt $MAX_ATTEMPTS ]; then
              sleep $WAIT_TIME
            fi
          done
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "❌ Health check failed"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Troubleshooting:"
          echo "• Logs: https://insightbridge-backend-test.scm.azurewebsites.net/api/logs/docker"
          echo "• Kudu: https://insightbridge-backend-test.scm.azurewebsites.net"
          echo ""
          echo "Commands to run in Kudu:"
          echo "  cd /home/site/wwwroot"
          echo "  ls -la  # Check files"
          echo "  cat oryx-manifest.toml  # Check if build ran"
          echo "  python -m pip list | grep uvicorn  # Check if uvicorn installed"
          echo ""
          
          exit 1
