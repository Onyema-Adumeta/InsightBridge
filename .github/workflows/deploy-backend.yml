name: Deploy Backend (FastAPI)
on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Zip backend source
        run: |
          cd backend
          zip -r ../backend.zip . -x ".git/*" "__pycache__/*" ".pytest_cache/*" "*.pyc" ".venv/*" "venv/*"
      
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: '{"clientId":"${{ secrets.AZUREAPPSERVICE_CLIENTID_BACKEND }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BACKEND }}","tenantId":"${{ secrets.AZUREAPPSERVICE_TENANTID_BACKEND }}"}'
      
      - name: Restart app to clear any locks
        run: |
          az webapp restart --name insightbridge-backend-test --resource-group InsightBridge-Test-RG
          echo "Waiting for restart to complete..."
          sleep 20
      
      - name: Deploy using az webapp deploy
        run: |
          az webapp deploy \
            --resource-group InsightBridge-Test-RG \
            --name insightbridge-backend-test \
            --src-path backend.zip \
            --type zip \
            --async false \
            --clean true \
            --restart true
      
      - name: Azure logout
        run: az logout
        if: always()
