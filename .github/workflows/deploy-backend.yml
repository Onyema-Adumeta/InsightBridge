name: Deploy Backend (FastAPI)
on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Zip backend source
        run: |
          cd backend
          zip -r ../backend.zip . -x ".git/*" "__pycache__/*" ".pytest_cache/*" "*.pyc" ".venv/*" "venv/*"
      
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: '{"clientId":"${{ secrets.AZUREAPPSERVICE_CLIENTID_BACKEND }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BACKEND }}","tenantId":"${{ secrets.AZUREAPPSERVICE_TENANTID_BACKEND }}"}'
      
      - name: Stop App Service and Clear Locks
        run: |
          echo "Stopping web app..."
          az webapp stop --name insightbridge-backend-test --resource-group InsightBridge-Test-RG
          
          echo "Waiting for app to fully stop..."
          sleep 30
          
          echo "Restarting web app to clear any locks..."
          az webapp start --name insightbridge-backend-test --resource-group InsightBridge-Test-RG
          sleep 10
          
          echo "Stopping again for deployment..."
          az webapp stop --name insightbridge-backend-test --resource-group InsightBridge-Test-RG
          sleep 10
      
      - name: Deploy using Azure CLI (Zip Deploy)
        run: |
          az webapp deployment source config-zip \
            --resource-group InsightBridge-Test-RG \
            --name insightbridge-backend-test \
            --src backend.zip \
            --timeout 600
      
      - name: Start App Service
        run: |
          az webapp start --name insightbridge-backend-test --resource-group InsightBridge-Test-RG
      
      - name: Azure logout
        run: az logout
        if: always()
