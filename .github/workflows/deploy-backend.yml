name: Deploy Backend (FastAPI)

on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Create deployment package with dependencies
        run: |
          cd backend
          
          # Verify requirements.txt and startup.sh exist
          echo "Checking required files..."
          ls -la requirements.txt
          ls -la startup.sh
          
          # Create virtual environment and install dependencies
          echo "Installing dependencies..."
          python -m venv antenv
          source antenv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          deactivate
          
          # Create deployment package including virtual environment
          echo "Creating deployment package..."
          zip -r ../backend.zip . \
            -x "*.git*" \
            -x "*__pycache__*" \
            -x "*.pytest_cache*" \
            -x "*.pyc" \
            -x ".env" \
            -x "*.db" \
            -x "test*.py" \
            -x "debug*.py"
          
          cd ..
          echo "✅ Package created ($(du -h backend.zip | cut -f1))"
          
          echo ""
          echo "📦 Package contents:"
          unzip -l backend.zip | head -20
      
      - name: Deploy via Kudu API
        run: |
          echo "🚀 Deploying backend to Azure..."
          
          response=$(curl -X POST \
            -u '$insightbridge-backend-test:7fpDMWkLmqiWql3Ztqx93quEzpZbKW9p2mD4LngMbfXQrJSCKBw1qztmWi5q' \
            --data-binary @backend.zip \
            -H "Content-Type: application/octet-stream" \
            -w "\n%{http_code}" \
            -s \
            https://insightbridge-backend-test.scm.azurewebsites.net/api/zipdeploy)
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)
          
          echo "Response: $body"
          echo "Status code: $http_code"
          
          if [ "$http_code" = "200" ] || [ "$http_code" = "202" ]; then
            echo "✅ Deployment successful!"
            exit 0
          else
            echo "❌ Deployment failed!"
            echo "Response body: $body"
            exit 1
          fi
      
      - name: Wait for deployment to complete
        run: |
          echo "⏳ Waiting for app to start..."
          sleep 30
          
          echo "🔍 Checking health endpoint..."
          for i in {1..5}; do
            if curl -f -s https://insightbridge-backend-test.azurewebsites.net/api/v1/main/health > /dev/null; then
              echo "✅ Application is healthy!"
              exit 0
            fi
            echo "Attempt $i failed, waiting..."
            sleep 10
          done
          
          echo "⚠️ Health check timeout - check logs in Azure Portal"
